<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Neoclassical Arch Museum Wall -->
  <path d="M 120 450 L 120 180 Q 400 60 680 180 L 680 450 Z" fill="#1e293b" opacity="0.6"/>
  <path d="M 150 450 L 150 190 Q 400 85 650 190 L 650 450 Z" fill="#0f172a" opacity="0.8"/>

  <!-- Museum Display Pedestal -->
  <polygon points="180,450 620,450 660,490 140,490" fill="url(#pedestalGrad)"/>
  <rect x="200" y="440" width="400" height="15" rx="4" fill="#334155"/>

  <!-- Violin / Cretan Lyra (Left Center) -->
  <g transform="translate(240, 160)">
    <!-- Lyra Body -->
    <path d="M 40 80 C 10 110 0 160 20 200 C 40 230 70 230 90 200 C 110 160 100 110 70 80 Z" fill="url(#woodGrad)"/>
    <!-- Sound Holes -->
    <circle cx="42" cy="150" r="5" fill="#451a03"/>
    <circle cx="68" cy="150" r="5" fill="#451a03"/>
    <!-- Neck & Pegbox -->
    <rect x="50" y="20" width="10" height="65" fill="#78350f"/>
    <path d="M 45 20 Q 55 5 65 20 Z" fill="#b45309"/>
    <!-- Strings -->
    <line x1="52" y1="20" x2="52" y2="215" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="55" y1="20" x2="55" y2="215" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="58" y1="20" x2="58" y2="215" stroke="#fef3c7" stroke-width="1.5"/>
    <!-- Bow -->
    <line x1="-15" y1="230" x2="125" y2="120" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-12" y1="228" x2="122" y2="122" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Brass Horn / Folk Trumpet (Right Center) -->
  <g transform="translate(430, 160)">
    <!-- Bell Flare -->
    <path d="M 120 70 Q 150 50 170 30 L 170 120 Q 150 100 120 80 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <ellipse cx="170" cy="75" rx="8" ry="45" fill="#ca8a04"/>
    <ellipse cx="170" cy="75" rx="5" ry="38" fill="#713f12"/>
    <!-- Tubing -->
    <path d="M 120 75 L 30 75 Q 10 75 10 95 Q 10 115 30 115 L 90 115 Q 110 115 110 135 Q 110 155 90 155 L 20 155" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>
    <!-- Valves -->
    <rect x="50" y="60" width="8" height="30" fill="url(#goldGrad)"/>
    <rect x="65" y="60" width="8" height="30" fill="url(#goldGrad)"/>
    <rect x="80" y="60" width="8" height="30" fill="url(#goldGrad)"/>
    <!-- Mouthpiece -->
    <polygon points="20,150 5,145 5,165 20,160" fill="url(#goldGrad)"/>
  </g>

  <!-- Shepherds Flute / Floyera (Diagonal across center) -->
  <g transform="translate(280, 240) rotate(-25)">
    <rect x="0" y="0" width="260" height="14" rx="6" fill="#78350f" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="40" cy="7" r="3" fill="#1e1b4b"/>
    <circle cx="80" cy="7" r="3" fill="#1e1b4b"/>
    <circle cx="110" cy="7" r="3" fill="#1e1b4b"/>
    <circle cx="140" cy="7" r="3" fill="#1e1b4b"/>
    <circle cx="170" cy="7" r="3" fill="#1e1b4b"/>
    <circle cx="200" cy="7" r="3" fill="#1e1b4b"/>
  </g>

  <!-- Floating Musical Notes -->
  <g fill="#38bdf8" opacity="0.85">
    <path d="M 210 120 q 15 -20 30 -5 l 0 -40 l 25 -5 l 0 35 q -10 -15 -25 0 z"/>
    <circle cx="215" cy="125" r="8"/>
    <circle cx="270" cy="115" r="8"/>
    <path d="M 580 90 l 0 -35 l 20 -4 l 0 30 z"/>
    <circle cx="580" cy="95" r="7"/>
  </g>

  <!-- Museum Plaque Title -->
  <rect x="260" y="445" width="280" height="38" rx="6" fill="#0f172a" stroke="#ca8a04" stroke-width="2"/>
  <text x="400" y="468" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fef08a" text-anchor="middle">MUSEUM OF GREEK FOLK INSTRUMENTS</text>
</svg>