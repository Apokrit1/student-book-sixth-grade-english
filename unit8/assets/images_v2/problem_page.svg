<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="forestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Forest Background -->
  <rect width="800" height="500" fill="url(#forestBg)"/>

  <!-- Magazine Problem Page Sheet -->
  <rect x="120" y="40" width="560" height="420" rx="12" fill="url(#pageGrad)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>

  <!-- Magazine Masthead Header -->
  <rect x="120" y="40" width="560" height="60" rx="12" fill="#0f766e"/>
  <rect x="120" y="70" width="560" height="30" fill="#0f766e"/>
  <text x="400" y="78" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#f0fdfa" text-anchor="middle">SCHOOL MAGAZINE: ADVICE COLUMN</text>

  <!-- Letter Column: The Wolf's Letter -->
  <rect x="150" y="120" width="240" height="230" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0f766e">DEAR COUNSELOR CLARA,</text>
  <text x="165" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">I have a big problem. In every fairy</text>
  <text x="165" y="190" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">tale, I am called the Big Bad Wolf.</text>
  <text x="165" y="210" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">Villagers run away when I visit!</text>
  <text x="165" y="240" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">In truth, I only want to make friends</text>
  <text x="165" y="260" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">and play my trumpet in the band.</text>
  <text x="165" y="280" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">What should I do?</text>
  <text x="165" y="320" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#64748b">— Lonely Musician Wolf</text>

  <!-- Clara's Reply Column -->
  <rect x="410" y="120" width="240" height="230" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="425" y="145" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#047857">CLARA'S FRIENDLY ADVICE:</text>
  <text x="425" y="170" font-family="'Segoe UI', sans-serif" font-size="11" fill="#065f46">Dear Wolf, you shouldn't give up!</text>
  <text x="425" y="195" font-family="'Segoe UI', sans-serif" font-size="11" fill="#065f46">1. You should write a letter to apologize</text>
  <text x="440" y="212" font-family="'Segoe UI', sans-serif" font-size="11" fill="#065f46">for any past misunderstandings.</text>
  <text x="425" y="235" font-family="'Segoe UI', sans-serif" font-size="11" fill="#065f46">2. You ought to invite everyone to a</text>
  <text x="440" y="252" font-family="'Segoe UI', sans-serif" font-size="11" fill="#065f46">free outdoor garden concert.</text>
  <text x="425" y="275" font-family="'Segoe UI', sans-serif" font-size="11" fill="#065f46">3. Music brings people together!</text>
  <text x="425" y="320" font-family="'Segoe UI', sans-serif" font-size="11" font-style="italic" fill="#047857">— Counselor Clara</text>

  <!-- Trumpet Graphic Overlapping Page Bottom -->
  <g transform="translate(320, 360)">
    <!-- Trumpet Bell -->
    <path d="M 120 20 Q 140 10 155 0 L 155 45 Q 140 35 120 25 Z" fill="url(#brassGrad)"/>
    <ellipse cx="155" cy="22" rx="4" ry="22" fill="#ca8a04"/>
    <!-- Tubing -->
    <path d="M 120 22 L 30 22 Q 15 22 15 32 Q 15 42 30 42 L 80 42 Q 95 42 95 52 Q 95 62 80 62 L 10 62" fill="none" stroke="url(#brassGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Valves -->
    <rect x="45" y="12" width="6" height="20" fill="url(#brassGrad)"/>
    <rect x="57" y="12" width="6" height="20" fill="url(#brassGrad)"/>
    <rect x="69" y="12" width="6" height="20" fill="url(#brassGrad)"/>
  </g>

  <!-- Friendly Wolf Silhouette / Badge -->
  <g transform="translate(145, 365)">
    <circle cx="25" cy="25" r="22" fill="#334155"/>
    <text x="25" y="32" font-size="22" text-anchor="middle">🐺</text>
  </g>
</svg>