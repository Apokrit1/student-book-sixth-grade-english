<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="200" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="510" cy="70" r="45" fill="#fef08a" opacity="0.85"/>
  <circle cx="510" cy="70" r="32" fill="#fde047"/>

  <!-- Clouds -->
  <path d="M 60,80 Q 80,60 110,70 Q 140,55 170,75 Q 190,95 160,105 Q 130,110 80,100 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 330,60 Q 350,45 380,55 Q 400,45 420,60 Q 435,75 410,85 Q 380,90 340,80 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Distant Islands -->
  <path d="M 120,185 Q 190,165 260,185 Z" fill="#0284c7" opacity="0.5"/>
  <path d="M 360,185 Q 420,170 480,185 Z" fill="#0284c7" opacity="0.4"/>

  <!-- Sea -->
  <rect y="180" width="600" height="75" fill="url(#seaGrad)"/>

  <!-- Gentle waves -->
  <path d="M 0,220 Q 75,215 150,220 T 300,220 T 450,220 T 600,220 L 600,230 L 0,230 Z" fill="#7dd3fc" opacity="0.6"/>
  <path d="M 0,240 Q 60,235 120,240 T 240,240 T 360,240 T 480,240 T 600,240 L 600,255 L 0,255 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Golden Sand Beach -->
  <path d="M 0,250 Q 300,235 600,250 L 600,400 L 0,400 Z" fill="url(#sandGrad)"/>

  <!-- Beach Umbrellas -->
  <!-- Umbrella 1 (Red & White) -->
  <g filter="url(#softShadow)">
    <line x1="120" y1="260" x2="120" y2="340" stroke="#78350f" stroke-width="4"/>
    <path d="M 70,260 Q 120,205 170,260 Z" fill="#ef4444"/>
    <path d="M 95,260 Q 120,205 145,260 Z" fill="#ffffff"/>
  </g>
  <!-- Umbrella 2 (Blue & Yellow) -->
  <g filter="url(#softShadow)">
    <line x1="280" y1="270" x2="280" y2="350" stroke="#78350f" stroke-width="4"/>
    <path d="M 230,270 Q 280,215 330,270 Z" fill="#0284c7"/>
    <path d="M 255,270 Q 280,215 305,270 Z" fill="#facc15"/>
  </g>
  <!-- Umbrella 3 (Green & White) -->
  <g filter="url(#softShadow)">
    <line x1="450" y1="255" x2="450" y2="335" stroke="#78350f" stroke-width="4"/>
    <path d="M 405,255 Q 450,205 495,255 Z" fill="#16a34a"/>
    <path d="M 427,255 Q 450,205 472,255 Z" fill="#ffffff"/>
  </g>

  <!-- Beach Towels & Accessories (Crowded Beach feel without real people) -->
  <rect x="80" y="325" width="60" height="35" rx="4" fill="#3b82f6" transform="rotate(-10, 80, 325)"/>
  <rect x="180" y="335" width="65" height="30" rx="4" fill="#ec4899" transform="rotate(5, 180, 335)"/>
  <rect x="330" y="320" width="70" height="35" rx="4" fill="#10b981" transform="rotate(-15, 330, 320)"/>
  <rect x="470" y="330" width="65" height="32" rx="4" fill="#f97316" transform="rotate(8, 470, 330)"/>

  <!-- Beach Ball -->
  <g transform="translate(240, 350)">
    <circle cx="15" cy="15" r="15" fill="#f43f5e"/>
    <path d="M 15,0 A 15,15 0 0,1 25,26 L 15,15 Z" fill="#3b82f6"/>
    <path d="M 15,0 A 15,15 0 0,0 5,26 L 15,15 Z" fill="#eab308"/>
    <circle cx="15" cy="15" r="4" fill="#ffffff"/>
  </g>

  <!-- Sand Castle -->
  <g transform="translate(380, 345)">
    <rect x="10" y="15" width="30" height="25" fill="#ca8a04" rx="2"/>
    <rect x="6" y="10" width="8" height="10" fill="#ca8a04"/>
    <rect x="21" y="8" width="8" height="12" fill="#ca8a04"/>
    <rect x="36" y="10" width="8" height="10" fill="#ca8a04"/>
    <path d="M 25,2 L 25,8 L 33,5 Z" fill="#ef4444"/>
  </g>

  <!-- Footprints in Sand (illustrating walk on beach) -->
  <ellipse cx="160" cy="370" rx="5" ry="8" fill="#ca8a04" opacity="0.6" transform="rotate(20, 160, 370)"/>
  <ellipse cx="175" cy="360" rx="5" ry="8" fill="#ca8a04" opacity="0.6" transform="rotate(20, 175, 360)"/>
  <ellipse cx="190" cy="372" rx="5" ry="8" fill="#ca8a04" opacity="0.6" transform="rotate(20, 190, 372)"/>
  <ellipse cx="205" cy="362" rx="5" ry="8" fill="#ca8a04" opacity="0.6" transform="rotate(20, 205, 362)"/>

  <!-- Sea Gulls -->
  <path d="M 210,110 Q 220,102 230,110 Q 240,102 250,110" stroke="#0369a1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 280,95 Q 288,88 296,95 Q 304,88 312,95" stroke="#0369a1" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Caption Bar -->
  <rect x="15" y="15" width="220" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)"/>
  <text x="32" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">📸 Summer Holiday Snapshot</text>
</svg>
