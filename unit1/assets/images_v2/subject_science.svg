<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sciFlaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="atomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect width="200" height="200" rx="24" fill="#ecfdf5"/>
  <rect x="8" y="8" width="184" height="184" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>

  <!-- Science Flask -->
  <g transform="translate(60, 45)">
    <!-- Flask neck -->
    <rect x="28" y="10" width="24" height="40" fill="#cbd5e1" rx="2"/>
    <ellipse cx="40" cy="10" rx="14" ry="4" fill="#94a3b8"/>
    <!-- Flask body -->
    <path d="M 28,45 L 6,105 Q 0,120 15,120 L 65,120 Q 80,120 74,105 L 52,45 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Liquid inside -->
    <path d="M 20,75 L 9,105 Q 4,118 16,118 L 64,118 Q 76,118 71,105 L 60,75 Q 40,82 20,75 Z" fill="url(#sciFlaskGrad)"/>
    <!-- Bubbles -->
    <circle cx="35" cy="95" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="48" cy="85" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="28" cy="105" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Atom orbits (Lesson 2 Molecular structure project reference) -->
  <g transform="translate(140, 50)">
    <ellipse cx="15" cy="15" rx="22" ry="8" fill="none" stroke="#6366f1" stroke-width="2" transform="rotate(30, 15, 15)"/>
    <ellipse cx="15" cy="15" rx="22" ry="8" fill="none" stroke="#8b5cf6" stroke-width="2" transform="rotate(-30, 15, 15)"/>
    <circle cx="15" cy="15" r="6" fill="#f59e0b"/>
    <circle cx="32" cy="7" r="3" fill="#3b82f6"/>
    <circle cx="0" cy="25" r="3" fill="#ec4899"/>
  </g>
</svg>
