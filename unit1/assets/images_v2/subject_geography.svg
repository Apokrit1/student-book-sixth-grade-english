<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect width="200" height="200" rx="24" fill="#f0f9ff"/>
  <rect x="8" y="8" width="184" height="184" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>

  <!-- Globe Stand -->
  <g transform="translate(100, 105)">
    <!-- Base -->
    <ellipse cx="0" cy="55" rx="36" ry="8" fill="#64748b"/>
    <ellipse cx="0" cy="52" rx="32" ry="7" fill="#94a3b8"/>
    <rect x="-6" y="32" width="12" height="22" fill="#64748b"/>
    <!-- Metal Arc -->
    <path d="M -54,-10 A 58,58 0 1,0 48,34 L 0,38" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <!-- Globe Sphere -->
    <circle cx="0" cy="0" r="48" fill="url(#oceanGrad)"/>
    <!-- Continents -->
    <path d="M -25,-25 Q -10,-40 10,-30 Q 30,-20 25,0 Q 15,10 -5,5 Q -30,15 -35,-10 Z" fill="#22c55e"/>
    <path d="M -15,15 Q 5,10 15,25 Q 10,40 -5,35 Q -20,30 -15,15 Z" fill="#22c55e"/>
    <path d="M -40,-5 Q -30,-15 -25,-5 Q -35,10 -40,-5 Z" fill="#22c55e"/>
    <!-- Lat/Long lines -->
    <ellipse cx="0" cy="0" rx="48" ry="18" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <!-- North/South Axis Pin -->
    <line x1="-8" y1="-54" x2="8" y2="-44" stroke="#475569" stroke-width="4"/>
    <line x1="-8" y1="44" x2="8" y2="54" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- Compass Rose in corner -->
  <g transform="translate(150, 45) scale(0.6)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <polygon points="0,-18 5,0 0,18 -5,0" fill="#ef4444"/>
    <polygon points="-18,0 0,5 18,0 0,-5" fill="#3b82f6"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
