<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="grad_28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#3182ce" />
    </linearGradient>
    <filter id="shadow_28" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="320" height="240" rx="16" fill="url(#grad_28)" />
  
  <!-- Subtle pattern circle -->
  <circle cx="280" cy="40" r="80" fill="#ffffff" opacity="0.15" />
  <circle cx="40" cy="200" r="60" fill="#ffffff" opacity="0.12" />

  <!-- Inner Badge Container -->
  <rect x="24" y="24" width="272" height="192" rx="12" fill="#ffffff" fill-opacity="0.92" filter="url(#shadow_28)" />
  
  <!-- Category Tag -->
  <rect x="36" y="34" width="auto" height="20" rx="10" fill="#3182ce" opacity="0.12" />
  <text x="44" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#3182ce" letter-spacing="0.5">HARDWARE</text>

  <!-- Large Visual Icon -->
  <text x="160" y="115" font-size="52" text-anchor="middle" dominant-baseline="middle">🖨️</text>
  
  <!-- Word Label -->
  <text x="160" y="160" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#1a202c" text-anchor="middle">print</text>
  
  <!-- Subtitle/Detail -->
  <text x="160" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#718096" text-anchor="middle">[prɪnt] • Paper Output</text>
</svg>