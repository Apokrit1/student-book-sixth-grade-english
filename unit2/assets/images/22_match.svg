  <g>
    
        <path d="M110 68 L138 68 L138 125 C138 140, 102 142, 102 128 C102 118, 110 116, 110 105 Z" fill="#FF5A36" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
