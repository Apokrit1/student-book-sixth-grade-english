<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <pattern id="dots_16" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#BEF264" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Outer Bio-Warm Comic Card Frame -->
  <rect x="2" y="2" width="316" height="196" rx="18" fill="#ECFCCB" stroke="#0F172A" stroke-width="4"/>
  <rect x="6" y="6" width="308" height="188" rx="14" fill="url(#dots_16)"/>

  <!-- Hard Ink Offset Shadow + White Stage Panel -->
  <rect x="22" y="22" width="280" height="160" rx="12" fill="#0F172A"/>
  <rect x="18" y="18" width="280" height="160" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>

  <!-- Top-Left Issue Number Pill -->
  <rect x="28" y="28" width="42" height="22" rx="6" fill="#0F172A"/>
  <text x="49" y="43" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#A3E635" text-anchor="middle">#16</text>

  <!-- Top-Right Category Tag -->
  <rect x="196" y="28" width="92" height="22" rx="11" fill="#A3E635" stroke="#0F172A" stroke-width="2.5"/>
  <text x="242" y="43" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#0F172A" text-anchor="middle">SHOPS</text>

  <!-- Custom Vector Comic Illustration -->
  <g>
    
        <rect x="115" y="55" width="90" height="100" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
        <rect x="125" y="65" width="70" height="22" rx="4" fill="#FF5A36" stroke="#0F172A" stroke-width="2.5"/>
        <text x="160" y="81" font-family="'Bricolage Grotesque', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">SALE!</text>
        <rect x="125" y="96" width="30" height="24" rx="3" fill="#A3E635" stroke="#0F172A" stroke-width="2.5"/>
        <line x1="163" y1="102" x2="192" y2="102" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
        <line x1="163" y1="114" x2="186" y2="114" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
        <line x1="125" y1="134" x2="192" y2="134" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      
  </g>

  <!-- Floating Emoji Dual-Coding Sticker -->
  <circle cx="52" cy="138" r="18" fill="#FEFCE8" stroke="#0F172A" stroke-width="2.5"/>
  <text x="52" y="144" font-size="18" text-anchor="middle">📄</text>

  <!-- Bottom Visual Cue Banner -->
  <rect x="78" y="152" width="208" height="18" rx="5" fill="#0F172A"/>
  <text x="182" y="164" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FEFCE8" letter-spacing="0.6" text-anchor="middle">PRINTED SHOP OFFERS</text>
</svg>
