<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <pattern id="dots_31" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#7DD3FC" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Outer Bio-Warm Comic Card Frame -->
  <rect x="2" y="2" width="316" height="196" rx="18" fill="#E0F2FE" stroke="#0F172A" stroke-width="4"/>
  <rect x="6" y="6" width="308" height="188" rx="14" fill="url(#dots_31)"/>

  <!-- Hard Ink Offset Shadow + White Stage Panel -->
  <rect x="22" y="22" width="280" height="160" rx="12" fill="#0F172A"/>
  <rect x="18" y="18" width="280" height="160" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>

  <!-- Top-Left Issue Number Pill -->
  <rect x="28" y="28" width="42" height="22" rx="6" fill="#0F172A"/>
  <text x="49" y="43" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#A3E635" text-anchor="middle">#31</text>

  <!-- Top-Right Category Tag -->
  <rect x="196" y="28" width="92" height="22" rx="11" fill="#38BDF8" stroke="#0F172A" stroke-width="2.5"/>
  <text x="242" y="43" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#0F172A" text-anchor="middle">SHOPPING</text>

  <!-- Custom Vector Comic Illustration -->
  <g>
    
        <rect x="102" y="105" width="52" height="45" rx="4" fill="#F59E0B" stroke="#0F172A" stroke-width="3.5"/>
        <rect x="162" y="105" width="52" height="45" rx="4" fill="#F59E0B" stroke="#0F172A" stroke-width="3.5"/>
        <rect x="132" y="58" width="52" height="45" rx="4" fill="#FACC15" stroke="#0F172A" stroke-width="3.5"/>
        <text x="158" y="86" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle">x12</text>
      
  </g>

  <!-- Floating Emoji Dual-Coding Sticker -->
  <circle cx="52" cy="138" r="18" fill="#FEFCE8" stroke="#0F172A" stroke-width="2.5"/>
  <text x="52" y="144" font-size="18" text-anchor="middle">📦</text>

  <!-- Bottom Visual Cue Banner -->
  <rect x="78" y="152" width="208" height="18" rx="5" fill="#0F172A"/>
  <text x="182" y="164" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FEFCE8" letter-spacing="0.6" text-anchor="middle">AMOUNT OF GOODS</text>
</svg>
