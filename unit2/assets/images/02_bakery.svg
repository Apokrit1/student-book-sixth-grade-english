<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <pattern id="dots_02" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#BEF264" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Outer Bio-Warm Comic Card Frame -->
  <rect x="2" y="2" width="316" height="196" rx="18" fill="#ECFCCB" stroke="#0F172A" stroke-width="4"/>
  <rect x="6" y="6" width="308" height="188" rx="14" fill="url(#dots_02)"/>

  <!-- Hard Ink Offset Shadow + White Stage Panel -->
  <rect x="22" y="22" width="280" height="160" rx="12" fill="#0F172A"/>
  <rect x="18" y="18" width="280" height="160" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>

  <!-- Top-Left Issue Number Pill -->
  <rect x="28" y="28" width="42" height="22" rx="6" fill="#0F172A"/>
  <text x="49" y="43" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#A3E635" text-anchor="middle">#02</text>

  <!-- Top-Right Category Tag -->
  <rect x="196" y="28" width="92" height="22" rx="11" fill="#A3E635" stroke="#0F172A" stroke-width="2.5"/>
  <text x="242" y="43" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#0F172A" text-anchor="middle">SHOPS</text>

  <!-- Custom Vector Comic Illustration -->
  <g>
    
        <rect x="95" y="75" width="130" height="80" rx="6" fill="#FEF3C7" stroke="#0F172A" stroke-width="3.5"/>
        <path d="M88 75 L105 50 L215 50 L232 75 Z" fill="#FF5A36" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
        <rect x="115" y="95" width="50" height="38" rx="4" fill="#E0F2FE" stroke="#0F172A" stroke-width="3"/>
        <rect x="175" y="95" width="32" height="60" rx="3" fill="#D97706" stroke="#0F172A" stroke-width="3"/>
        <ellipse cx="140" cy="118" rx="16" ry="9" fill="#F59E0B" stroke="#0F172A" stroke-width="2.5"/>
      
  </g>

  <!-- Floating Emoji Dual-Coding Sticker -->
  <circle cx="52" cy="138" r="18" fill="#FEFCE8" stroke="#0F172A" stroke-width="2.5"/>
  <text x="52" y="144" font-size="18" text-anchor="middle">🥐</text>

  <!-- Bottom Visual Cue Banner -->
  <rect x="78" y="152" width="208" height="18" rx="5" fill="#0F172A"/>
  <text x="182" y="164" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FEFCE8" letter-spacing="0.6" text-anchor="middle">BREAD & CAKES SHOP</text>
</svg>
