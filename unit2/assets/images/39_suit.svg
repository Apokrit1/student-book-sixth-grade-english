<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <pattern id="dots_39" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFBDAE" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Outer Bio-Warm Comic Card Frame -->
  <rect x="2" y="2" width="316" height="196" rx="18" fill="#FFE8E2" stroke="#0F172A" stroke-width="4"/>
