  <text x="242" y="43" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">CLOTHES</text>

  <!-- Custom Vector Comic Illustration -->
  <g>
    
        <circle cx="160" cy="88" r="28" fill="#A3E635" stroke="#0F172A" stroke-width="3.5"/>
        <path d="M146 88 L156 98 L176 76" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
