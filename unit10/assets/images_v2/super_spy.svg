<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Soundstage Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Studio Ceiling Grid & Trusses -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#334155" stroke-width="4"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#334155" stroke-width="2"/>
  <path d="M 50 40 L 90 80 L 130 40 L 170 80 L 210 40 L 250 80 L 290 40 L 330 80 L 370 40 L 410 80 L 450 40 L 490 80 L 530 40 L 570 80 L 610 40 L 650 80 L 690 40 L 730 80 L 770 40" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Overhead Studio Spotlights -->
  <!-- Left Spotlight -->
  <g transform="translate(180, 40)">
    <rect x="-20" y="0" width="40" height="35" rx="4" fill="#475569"/>
    <polygon points="-25,35 25,35 15,48 -15,48" fill="#64748b"/>
    <polygon points="-20,48 20,48 160,420 -80,420" fill="url(#beamGrad)"/>
    <circle cx="0" cy="42" r="14" fill="#e0f2fe" filter="url(#neonGlow)"/>
  </g>
  <!-- Right Spotlight -->
  <g transform="translate(620, 40)">
    <rect x="-20" y="0" width="40" height="35" rx="4" fill="#475569"/>
    <polygon points="-25,35 25,35 15,48 -15,48" fill="#64748b"/>
    <polygon points="-20,48 20,48 100,420 -140,420" fill="url(#beamGrad)"/>
    <circle cx="0" cy="42" r="14" fill="#e0f2fe" filter="url(#neonGlow)"/>
  </g>

  <!-- Studio Floor Line & Reflection -->
  <polygon points="0,380 800,380 800,500 0,500" fill="#0b1120"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#1e293b" stroke-width="2"/>

  <!-- High-Tech Mission Briefing Hologram Screen (Center-Back) -->
  <g transform="translate(250, 110)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="300" height="190" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="3" opacity="0.9"/>
    <!-- Holographic Glow Inside -->
    <rect x="8" y="8" width="284" height="174" rx="6" fill="url(#screenGrad)" opacity="0.15"/>
    <!-- World Map Grid Graphic -->
    <circle cx="150" cy="95" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    <ellipse cx="150" cy="95" rx="65" ry="30" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <line x1="85" y1="95" x2="215" y2="95" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <line x1="150" y1="30" x2="150" y2="160" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <!-- Mission Target Blips -->
    <circle cx="120" cy="80" r="5" fill="#ef4444" filter="url(#neonGlow)"/>
    <circle cx="175" cy="110" r="5" fill="#22c55e" filter="url(#neonGlow)"/>
    <!-- Screen Header -->
    <rect x="20" y="16" width="110" height="12" rx="3" fill="#38bdf8" opacity="0.7"/>
    <text x="25" y="25" fill="#0f172a" font-family="monospace" font-size="8" font-weight="bold">MISSION INTEL // 007</text>
    <line x1="20" y1="35" x2="160" y2="35" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="20" y="172" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">SYSTEM STATUS: TOP SECRET</text>
  </g>

  <!-- Secret Spy Silhouette & Modern Trenchcoat (Center Stage) -->
  <g transform="translate(390, 240)">
    <!-- Spy Body Silhouette -->
    <!-- Head & Hair -->
    <ellipse cx="25" cy="30" rx="14" ry="18" fill="#1e293b"/>
    <path d="M 12 26 Q 25 12 38 24 Q 28 16 12 26 Z" fill="#0f172a"/>
    <!-- Smart Collar & Tie -->
    <polygon points="18,48 32,48 28,68 25,90 22,68" fill="#ef4444"/>
    <polygon points="12,46 25,58 18,48" fill="#f8fafc"/>
    <polygon points="38,46 25,58 32,48" fill="#f8fafc"/>
    <!-- Tailored Coat -->
    <path d="M 6 52 C -5 70 -8 115 -10 145 L 60 145 C 58 115 55 70 44 52 Z" fill="#0f172a"/>
    <path d="M 6 52 L 20 145 M 44 52 L 30 145" stroke="#334155" stroke-width="1.5"/>
    <!-- Sophisticated Watch / Gadget on Wrist -->
    <circle cx="-6" cy="115" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
    <!-- Spy Shadow -->
    <ellipse cx="25" cy="148" rx="45" ry="10" fill="#020617" opacity="0.6"/>
  </g>

  <!-- Director's Chair (Left Foreground) -->
  <g transform="translate(80, 260)">
    <!-- Backrest with "DIRECTOR" -->
    <rect x="15" y="40" width="80" height="32" rx="4" fill="url(#chairGrad)" stroke="#6366f1" stroke-width="1"/>
    <text x="25" y="60" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5">DIRECTOR</text>
    <!-- Chair Seat -->
    <polygon points="10,95 100,95 90,110 20,110" fill="#312e81"/>
    <!-- Crossed Wooden Legs -->
    <line x1="20" y1="72" x2="90" y2="175" stroke="#94a3b8" stroke-width="4"/>
    <line x1="90" y1="72" x2="20" y2="175" stroke="#94a3b8" stroke-width="4"/>
    <!-- Floor shadow -->
    <ellipse cx="55" cy="178" rx="45" ry="8" fill="#020617" opacity="0.5"/>
  </g>

  <!-- Movie Clapperboard (Right Foreground) -->
  <g transform="translate(640, 310)">
    <!-- Clapper Lower Board -->
    <rect x="0" y="30" width="110" height="80" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="12" y="55" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">SCENE</text>
    <text x="12" y="75" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">10B</text>
    <text x="60" y="55" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">TAKE</text>
    <text x="60" y="75" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">04</text>
    <line x1="10" y1="85" x2="100" y2="85" stroke="#334155" stroke-width="1"/>
    <text x="18" y="100" fill="#fde047" font-family="sans-serif" font-size="8" font-weight="bold">SUPER SPY</text>
    <!-- Slanted Clapper Top Sticks with Chevron Stripes -->
    <g transform="rotate(-15, 0, 30)">
      <rect x="0" y="8" width="110" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <!-- Diagonal White Stripes -->
      <polygon points="15,8 28,8 20,28 7,28" fill="#f8fafc"/>
      <polygon points="40,8 53,8 45,28 32,28" fill="#f8fafc"/>
      <polygon points="65,8 78,8 70,28 57,28" fill="#f8fafc"/>
      <polygon points="90,8 103,8 95,28 82,28" fill="#f8fafc"/>
    </g>
    <!-- Clapper Shadow -->
    <ellipse cx="55" cy="115" rx="50" ry="8" fill="#020617" opacity="0.6"/>
  </g>

  <!-- Studio Video Camera on Heavy Tripod (Right-Center) -->
  <g transform="translate(540, 230)">
    <!-- Tripod Legs -->
    <line x1="30" y1="60" x2="-10" y2="170" stroke="#475569" stroke-width="4"/>
    <line x1="30" y1="60" x2="30" y2="175" stroke="#64748b" stroke-width="4"/>
    <line x1="30" y1="60" x2="70" y2="170" stroke="#475569" stroke-width="4"/>
    <!-- Camera Body -->
    <rect x="10" y="25" width="55" height="35" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-8" y="32" width="20" height="22" rx="2" fill="#334155"/>
    <!-- Lens Hood -->
    <polygon points="-8,30 -22,24 -22,62 -8,56" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <!-- Red Recording Indicator Light -->
    <circle cx="55" cy="35" r="4" fill="#ef4444" filter="url(#neonGlow)"/>
    <!-- Side Viewfinder Screen -->
    <polygon points="25,20 50,15 50,25 25,25" fill="#38bdf8" opacity="0.7"/>
  </g>
</svg>
