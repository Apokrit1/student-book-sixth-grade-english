<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="filmStripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="storyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="500" fill="url(#warmStudio)"/>

  <!-- Warm Reading Lamp Light Cone -->
  <polygon points="120,40 20,450 360,450" fill="#fef08a" opacity="0.08"/>

  <!-- Writer & Illustrator Desk Surface -->
  <polygon points="0,350 800,350 800,500 0,500" fill="url(#deskWood)"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#92400e" stroke-width="3"/>

  <!-- Desk Lamp (Left) -->
  <g transform="translate(100, 140)">
    <!-- Base -->
    <ellipse cx="20" cy="210" rx="35" ry="10" fill="#334155"/>
    <!-- Stem -->
    <path d="M 20 210 L 40 100 L 10 30" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="100" r="7" fill="#475569"/>
    <!-- Lamp Shade -->
    <polygon points="10,30 -25,-5 20,-20 40,20" fill="#38bdf8"/>
    <circle cx="15" cy="5" r="8" fill="#fef08a" filter="url(#storyGlow)"/>
  </g>

  <!-- Giant Open Hardcover Novel (Center Desk) -->
  <g transform="translate(300, 290)">
    <!-- Book Shadow -->
    <ellipse cx="100" cy="85" rx="140" ry="18" fill="#020617" opacity="0.7"/>
    <!-- Book Spine & Hardcover Base -->
    <path d="M -10 65 Q 100 80 210 65 L 215 70 Q 100 85 -15 70 Z" fill="#0284c7"/>
    <!-- Left Pages Stack -->
    <path d="M -8 60 Q 95 65 100 60 L 100 15 Q 90 20 -8 10 Z" fill="#f8fafc"/>
    <path d="M -5 63 Q 95 68 100 63 L 100 18 Q 90 23 -5 13 Z" fill="#f1f5f9"/>
    <!-- Right Pages Stack -->
    <path d="M 100 60 Q 105 65 208 60 L 208 10 Q 110 20 100 15 Z" fill="#f8fafc"/>
    <path d="M 100 63 Q 105 68 205 63 L 205 13 Q 110 23 100 18 Z" fill="#f1f5f9"/>
    <!-- Text Lines on Left Page -->
    <line x1="8" y1="22" x2="85" y2="22" stroke="#94a3b8" stroke-width="2"/>
    <line x1="8" y1="28" x2="80" y2="28" stroke="#94a3b8" stroke-width="2"/>
    <line x1="8" y1="34" x2="85" y2="34" stroke="#94a3b8" stroke-width="2"/>
    <line x1="8" y1="40" x2="65" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <line x1="8" y1="46" x2="85" y2="46" stroke="#94a3b8" stroke-width="2"/>
    <line x1="8" y1="52" x2="70" y2="52" stroke="#94a3b8" stroke-width="2"/>
    <!-- Text Lines on Right Page -->
    <line x1="115" y1="22" x2="192" y2="22" stroke="#94a3b8" stroke-width="2"/>
    <line x1="115" y1="28" x2="185" y2="28" stroke="#94a3b8" stroke-width="2"/>
    <line x1="115" y1="34" x2="192" y2="34" stroke="#94a3b8" stroke-width="2"/>
    <line x1="115" y1="40" x2="175" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <line x1="115" y1="46" x2="190" y2="46" stroke="#94a3b8" stroke-width="2"/>
    <line x1="115" y1="52" x2="180" y2="52" stroke="#94a3b8" stroke-width="2"/>
    <!-- Chapter Title -->
    <text x="100" y="8" fill="#1e293b" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BESTSELLER NOVEL</text>
  </g>

  <!-- Dynamic Celluloid Film Strip Rising from the Book into the Air -->
  <g transform="translate(360, 40)">
    <!-- Winding Film Ribbon -->
    <path d="M 40 260 C 20 180 180 140 130 60 C 90 -10 -20 20 -20 80" fill="none" stroke="#27272a" stroke-width="48" stroke-linecap="round"/>
    <path d="M 40 260 C 20 180 180 140 130 60 C 90 -10 -20 20 -20 80" fill="none" stroke="#09090b" stroke-width="36" stroke-linecap="round"/>
    <!-- Film Sprocket Holes along Ribbon Edge (Selected key holes) -->
    <g fill="#f8fafc" opacity="0.8">
      <rect x="22" y="230" width="5" height="3" rx="1"/>
      <rect x="24" y="210" width="5" height="3" rx="1"/>
      <rect x="36" y="185" width="5" height="3" rx="1"/>
      <rect x="65" y="160" width="5" height="3" rx="1"/>
      <rect x="110" y="140" width="5" height="3" rx="1"/>
      <rect x="145" y="115" width="5" height="3" rx="1"/>
      <rect x="140" y="80" width="5" height="3" rx="1"/>
      <rect x="105" y="55" width="5" height="3" rx="1"/>
      <rect x="55" y="45" width="5" height="3" rx="1"/>
      <rect x="15" y="55" width="5" height="3" rx="1"/>
    </g>
    <!-- Glowing Cinema Frames inside Film Ribbon -->
    <rect x="68" y="115" width="38" height="26" rx="3" fill="#38bdf8" opacity="0.75" filter="url(#storyGlow)"/>
    <rect x="100" y="65" width="38" height="26" rx="3" fill="#fde047" opacity="0.75" filter="url(#storyGlow)"/>
  </g>

  <!-- Storyboard Screenplay Concept Board (Left Wall) -->
  <g transform="translate(60, 50)">
    <!-- Cork Pinboard -->
    <rect x="0" y="0" width="190" height="130" rx="8" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <rect x="6" y="6" width="178" height="118" rx="4" fill="#d97706" opacity="0.7"/>
    <!-- Frame 1: Action Scene Sketch -->
    <rect x="14" y="14" width="75" height="48" rx="3" fill="#ffffff"/>
    <circle cx="35" cy="35" r="8" fill="#0284c7"/>
    <polygon points="50,45 65,25 70,45" fill="#ef4444"/>
    <text x="51" y="58" fill="#475569" font-family="sans-serif" font-size="6" text-anchor="middle">SCENE 1: CHASE</text>
    <!-- Frame 2: Climax Sketch -->
    <rect x="100" y="14" width="75" height="48" rx="3" fill="#ffffff"/>
    <polygon points="120,45 140,25 160,45" fill="#10b981"/>
    <circle cx="150" cy="25" r="5" fill="#fde047"/>
    <text x="137" y="58" fill="#475569" font-family="sans-serif" font-size="6" text-anchor="middle">SCENE 2: RESCUE</text>
    <!-- Screenplay Title Card -->
    <rect x="14" y="70" width="161" height="45" rx="3" fill="#ffffff"/>
    <text x="22" y="85" fill="#0f172a" font-family="monospace" font-size="8" font-weight="bold">SCREENPLAY DRAFT #3</text>
    <text x="22" y="98" fill="#64748b" font-family="monospace" font-size="7">ADAPTED FROM BESTSELLER</text>
  </g>

  <!-- Artist Easel with Colour Illustration (Right Foreground) -->
  <g transform="translate(610, 160)">
    <!-- Wooden Tripod Easel -->
    <line x1="50" y1="20" x2="10" y2="280" stroke="#a16207" stroke-width="6"/>
    <line x1="50" y1="20" x2="90" y2="280" stroke="#a16207" stroke-width="6"/>
    <line x1="50" y1="20" x2="50" y2="280" stroke="#713f12" stroke-width="5"/>
    <line x1="0" y1="180" x2="100" y2="180" stroke="#ca8a04" stroke-width="6"/>
    <!-- Canvas on Easel -->
    <rect x="5" y="60" width="90" height="115" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <!-- Vibrant Artwork on Canvas -->
    <rect x="12" y="68" width="76" height="70" fill="#38bdf8"/>
    <!-- Sailboat & Sunset Illustration -->
    <circle cx="50" cy="90" r="14" fill="#fbbf24"/>
    <polygon points="40,120 50,85 50,120" fill="#ffffff"/>
    <polygon points="52,95 62,120 52,120" fill="#ffffff"/>
    <polygon points="35,120 65,120 60,128 40,128" fill="#b91c1c"/>
    <rect x="12" y="125" width="76" height="13" fill="#0284c7"/>
    <text x="50" y="158" fill="#1e293b" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">BOOK ILLUSTRATION</text>
  </g>
</svg>
