<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mediaRoom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="criticsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Media Room Background -->
  <rect width="800" height="500" fill="url(#mediaRoom)"/>

  <!-- Wall Board: Film Review Ratings & Critiques (Center-Back) -->
  <g transform="translate(230, 40)">
    <!-- Whiteboard Frame -->
    <rect x="0" y="0" width="340" height="180" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="4"/>
    <!-- Header -->
    <rect x="10" y="10" width="320" height="32" rx="4" fill="#0f172a"/>
    <text x="170" y="32" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">SCHOOL FILM CRITICS CIRCLE</text>
    
    <!-- Review Column 1: Detective Mystery -->
    <rect x="15" y="52" width="148" height="115" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="25" y="70" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">“SHADOWS IN FOG”</text>
    <text x="25" y="85" fill="#64748b" font-family="sans-serif" font-size="8">Genre: Thriller / Mystery</text>
    <text x="25" y="98" fill="#64748b" font-family="sans-serif" font-size="8">Plot: Gripping &amp; Intense</text>
    <text x="25" y="111" fill="#64748b" font-family="sans-serif" font-size="8">Setting: Old Edinburgh</text>
    <!-- Five Star Rating -->
    <g fill="#eab308" transform="translate(25, 120) scale(0.6)">
      <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7"/>
      <polygon points="30,1 32,7 38,7 33,11 35,17 30,13 25,17 27,11 22,7 28,7"/>
      <polygon points="50,1 52,7 58,7 53,11 55,17 50,13 45,17 47,11 42,7 48,7"/>
      <polygon points="70,1 72,7 78,7 73,11 75,17 70,13 65,17 67,11 62,7 68,7"/>
      <polygon points="90,1 92,7 98,7 93,11 95,17 90,13 85,17 87,11 82,7 88,7" fill="#cbd5e1"/>
    </g>
    <text x="25" y="145" fill="#059669" font-family="sans-serif" font-size="8" font-weight="bold">VERDICT: 4.5 / 5 STARS</text>

    <!-- Review Column 2: Animated Comedy -->
    <rect x="177" y="52" width="148" height="115" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="187" y="70" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">“THE WILD ODYSSEY”</text>
    <text x="187" y="85" fill="#64748b" font-family="sans-serif" font-size="8">Genre: Animated Adventure</text>
    <text x="187" y="98" fill="#64748b" font-family="sans-serif" font-size="8">Characters: Charming &amp; Fun</text>
    <text x="187" y="111" fill="#64748b" font-family="sans-serif" font-size="8">Review: Highly Amusing</text>
    <!-- Five Star Rating -->
    <g fill="#eab308" transform="translate(187, 120) scale(0.6)">
      <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7"/>
      <polygon points="30,1 32,7 38,7 33,11 35,17 30,13 25,17 27,11 22,7 28,7"/>
      <polygon points="50,1 52,7 58,7 53,11 55,17 50,13 45,17 47,11 42,7 48,7"/>
      <polygon points="70,1 72,7 78,7 73,11 75,17 70,13 65,17 67,11 62,7 68,7"/>
      <polygon points="90,1 92,7 98,7 93,11 95,17 90,13 85,17 87,11 82,7 88,7"/>
    </g>
    <text x="187" y="145" fill="#059669" font-family="sans-serif" font-size="8" font-weight="bold">VERDICT: 5 / 5 STARS</text>
  </g>

  <!-- Wall Television Screen (Left Wall) -->
  <g transform="translate(40, 60)">
    <!-- Flat TV Frame -->
    <rect x="0" y="0" width="160" height="110" rx="6" fill="#020617" stroke="#475569" stroke-width="3"/>
    <rect x="8" y="8" width="144" height="94" rx="3" fill="url(#tvGrad)"/>
    <!-- News Announcer Desk Graphic -->
    <ellipse cx="80" cy="50" rx="14" ry="16" fill="#f8fafc"/>
    <polygon points="65,70 95,70 98,90 62,90" fill="#0f172a"/>
    <!-- Breaking News Ticker -->
    <rect x="8" y="84" width="144" height="18" fill="#ef4444"/>
    <text x="15" y="96" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold">CINEMA NEWS TODAY</text>
    <!-- Wall Bracket -->
    <rect x="65" y="110" width="30" height="15" fill="#1e293b"/>
  </g>

  <!-- Film Reel Canisters on Shelf (Right Wall) -->
  <g transform="translate(620, 70)">
    <rect x="0" y="90" width="140" height="10" rx="2" fill="#78350f"/>
    <!-- Metal Reel 1 -->
    <circle cx="45" cy="55" r="35" fill="#64748b" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="45" cy="55" r="10" fill="#1e293b"/>
    <circle cx="45" cy="35" r="5" fill="#0f172a"/>
    <circle cx="45" cy="75" r="5" fill="#0f172a"/>
    <circle cx="25" cy="55" r="5" fill="#0f172a"/>
    <circle cx="65" cy="55" r="5" fill="#0f172a"/>
    <!-- Metal Reel 2 -->
    <circle cx="100" cy="58" r="32" fill="#475569" stroke="#64748b" stroke-width="3"/>
    <circle cx="100" cy="58" r="9" fill="#1e293b"/>
  </g>

  <!-- Large Round Debate Table (Foreground Center) -->
  <g transform="translate(100, 270)">
    <!-- Floor Shadow -->
    <ellipse cx="300" cy="180" rx="360" ry="40" fill="#020617" opacity="0.6"/>
    <!-- Circular Table Top -->
    <ellipse cx="300" cy="130" rx="340" ry="85" fill="url(#tableGrad)"/>
    <ellipse cx="300" cy="126" rx="336" ry="80" fill="#1e40af"/>

    <!-- Open Review Notebook on Table (Left) -->
    <g transform="translate(80, 80) rotate(-8)">
      <rect x="0" y="0" width="110" height="75" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="55" y1="0" x2="55" y2="75" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="8" y1="18" x2="48" y2="18" stroke="#0284c7" stroke-width="2"/>
      <line x1="8" y1="28" x2="48" y2="28" stroke="#94a3b8" stroke-width="1"/>
      <line x1="8" y1="38" x2="48" y2="38" stroke="#94a3b8" stroke-width="1"/>
      <line x1="8" y1="48" x2="40" y2="48" stroke="#94a3b8" stroke-width="1"/>
      <!-- Blue Pen -->
      <line x1="45" y1="65" x2="65" y2="20" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Podcast / Debate Microphone (Center Table) -->
    <g transform="translate(285, 30)">
      <ellipse cx="15" cy="85" rx="20" ry="6" fill="#0f172a"/>
      <line x1="15" y1="85" x2="15" y2="45" stroke="#475569" stroke-width="5"/>
      <!-- Mic Grille Capsule -->
      <rect x="5" y="10" width="20" height="35" rx="10" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="5" y1="20" x2="25" y2="20" stroke="#334155" stroke-width="1"/>
      <line x1="5" y1="28" x2="25" y2="28" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Hot Chocolate / Coffee Mugs on Table -->
    <g transform="translate(440, 80)">
      <!-- Yellow Mug -->
      <rect x="0" y="10" width="28" height="32" rx="4" fill="#fbbf24"/>
      <path d="M 28 16 C 36 16 36 30 28 30" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <ellipse cx="14" cy="10" rx="14" ry="4" fill="#78350f"/>
    </g>
    <g transform="translate(480, 95)">
      <!-- Red Mug -->
      <rect x="0" y="8" width="26" height="30" rx="4" fill="#ef4444"/>
      <path d="M 26 14 C 34 14 34 26 26 26" fill="none" stroke="#ef4444" stroke-width="3.5"/>
      <ellipse cx="13" cy="8" rx="13" ry="3.5" fill="#451a03"/>
    </g>
  </g>
</svg>
