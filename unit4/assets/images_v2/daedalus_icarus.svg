<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="35%" stop-color="#ed8936" />
      <stop offset="70%" stop-color="#fbd38d" />
      <stop offset="100%" stop-color="#bee3f8" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3182ce" />
      <stop offset="40%" stop-color="#2b6cb0" />
      <stop offset="100%" stop-color="#1a365d" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="50%" stop-color="#faf089" />
      <stop offset="100%" stop-color="#ecc94b" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e0" />
    </linearGradient>
  </defs>

  <!-- Sky & Hot Aegean Sun -->
  <rect width="800" height="340" fill="url(#skyGrad)" />
  <circle cx="680" cy="90" r="65" fill="url(#sunGrad)" opacity="0.9" />
  <circle cx="680" cy="90" r="100" fill="#faf089" opacity="0.25" />

  <!-- Distant Cretan Hills -->
  <polygon points="0,340 120,270 260,340" fill="#718096" opacity="0.6" />
  <polygon points="180,340 340,240 500,340" fill="#4a5568" opacity="0.5" />

  <!-- Ancient Knossos & Labyrinth Architecture on Headland -->
  <path d="M 0 340 L 0 290 Q 70 285 140 310 L 220 340 Z" fill="#2d3748" />
  <rect x="25" y="270" width="18" height="25" fill="#e2e8f0" />
  <rect x="50" y="265" width="22" height="30" fill="#cbd5e0" />
  <rect x="80" y="275" width="16" height="20" fill="#e2e8f0" />
  <polygon points="15,270 50,250 85,270" fill="#c53030" opacity="0.8" />

  <!-- Sea with Waves -->
  <rect y="330" width="800" height="170" fill="url(#seaGrad)" />
  <path d="M 0 350 Q 100 340 200 355 Q 300 370 400 350 Q 500 335 600 355 Q 700 370 800 350 L 800 500 L 0 500 Z" fill="#2c5282" opacity="0.5" />
  <path d="M 0 390 Q 120 375 240 395 Q 360 410 480 390 Q 600 375 720 395 Q 780 405 800 395 L 800 500 L 0 500 Z" fill="#1a365d" opacity="0.7" />

  <!-- Daedalus Flying (Experienced, steady lower flight) -->
  <g transform="translate(280, 190)">
    <!-- Daedalus Wings -->
    <path d="M 0 0 C -50 -40 -110 -20 -130 15 C -90 10 -40 20 0 5 Z" fill="url(#wingGrad)" stroke="#a0aec0" stroke-width="1.5" />
    <path d="M 0 0 C 50 -40 110 -20 130 15 C 90 10 40 20 0 5 Z" fill="url(#wingGrad)" stroke="#a0aec0" stroke-width="1.5" />
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="8" ry="18" fill="#744210" transform="rotate(30)" />
    <circle cx="8" cy="-8" r="6" fill="#dd6b20" />
  </g>

  <!-- Icarus Flying Higher (Approaching the blinding sun) -->
  <g transform="translate(560, 110)">
    <!-- Wax Wings with Melting Tips -->
    <path d="M 0 0 C -45 -35 -95 -15 -115 15 C -80 12 -35 18 0 5 Z" fill="url(#wingGrad)" stroke="#ecc94b" stroke-width="1.5" />
    <path d="M 0 0 C 45 -40 100 -25 118 10 C 85 10 40 16 0 5 Z" fill="url(#wingGrad)" stroke="#ecc94b" stroke-width="1.5" />
    <!-- Yellow Wax Drops Melting -->
    <circle cx="85" cy="5" r="2.5" fill="#faf089" />
    <circle cx="95" cy="18" r="2" fill="#faf089" />
    <circle cx="70" cy="22" r="1.5" fill="#faf089" />
    <!-- Body -->
    <ellipse cx="0" cy="4" rx="7" ry="16" fill="#975a16" transform="rotate(25)" />
    <circle cx="7" cy="-7" r="5" fill="#ed8936" />
  </g>

  <!-- Title Badge -->
  <rect x="25" y="440" width="310" height="38" rx="8" fill="#1a202c" opacity="0.85" />
  <text x="40" y="465" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f7fafc">The Flight of Daedalus and Icarus</text>
</svg>
