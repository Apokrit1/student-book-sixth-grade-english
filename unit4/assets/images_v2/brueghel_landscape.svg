<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dd6b20" />
      <stop offset="35%" stop-color="#f6ad55" />
      <stop offset="65%" stop-color="#feebc8" />
      <stop offset="100%" stop-color="#90cdf4" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#319795" />
      <stop offset="40%" stop-color="#285e61" />
      <stop offset="100%" stop-color="#1d4044" />
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#975a16" />
      <stop offset="50%" stop-color="#744210" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
  </defs>

  <!-- Sky & Golden Horizon Glow -->
  <rect width="800" height="280" fill="url(#skyGrad)" />
  <circle cx="620" cy="180" r="40" fill="#feebc8" opacity="0.8" />
  <circle cx="620" cy="180" r="70" fill="#faf089" opacity="0.3" />

  <!-- Sea with Coastline -->
  <rect y="200" width="800" height="300" fill="url(#seaGrad)" />
  <!-- Distant Islands & Cliffs -->
  <polygon points="460,200 520,160 580,200" fill="#4a5568" opacity="0.7" />
  <polygon points="560,200 660,150 740,200" fill="#2d3748" opacity="0.6" />

  <!-- Foreground Terraced Plowing Field (Reddish-brown furrows) -->
  <path d="M 0 240 Q 180 220 340 300 Q 420 340 460 500 L 0 500 Z" fill="url(#hillGrad)" />
  <!-- Furrows of Plowed Earth -->
  <path d="M 30 300 Q 150 280 270 340" stroke="#5a330a" stroke-width="3" fill="none" />
  <path d="M 50 340 Q 170 320 290 380" stroke="#5a330a" stroke-width="3" fill="none" />
  <path d="M 70 380 Q 190 360 320 430" stroke="#5a330a" stroke-width="3" fill="none" />
  <path d="M 90 420 Q 210 400 350 480" stroke="#5a330a" stroke-width="3" fill="none" />

  <!-- The Farmer & His Horse Plowing the Field -->
  <g transform="translate(180, 270)">
    <!-- Horse -->
    <ellipse cx="40" cy="25" rx="22" ry="14" fill="#2d3748" />
    <circle cx="62" cy="15" r="9" fill="#1a202c" />
    <line x1="25" y1="35" x2="20" y2="60" stroke="#1a202c" stroke-width="4" />
    <line x1="35" y1="35" x2="35" y2="60" stroke="#1a202c" stroke-width="4" />
    <line x1="50" y1="35" x2="52" y2="60" stroke="#1a202c" stroke-width="4" />
    <!-- Wooden Plow -->
    <polygon points="5,35 15,35 0,55" fill="#744210" />
    <line x1="12" y1="35" x2="-15" y2="25" stroke="#744210" stroke-width="3" />
    <!-- Farmer in Red Tunic -->
    <ellipse cx="-18" cy="15" rx="8" ry="16" fill="#c53030" />
    <circle cx="-18" cy="-3" r="6" fill="#fbd38d" />
    <line x1="-16" y1="28" x2="-22" y2="55" stroke="#4a5568" stroke-width="3" />
    <line x1="-12" y1="28" x2="-10" y2="55" stroke="#4a5568" stroke-width="3" />
  </g>

  <!-- The Shepherd & Grazing Sheep on the Middle Slope -->
  <g transform="translate(350, 320)">
    <!-- Shepherd Leaning on Staff Looking Skyward -->
    <ellipse cx="20" cy="15" rx="6" ry="15" fill="#4a5568" />
    <circle cx="20" cy="-2" r="5" fill="#fbd38d" />
    <line x1="28" y1="-8" x2="28" y2="45" stroke="#744210" stroke-width="2.5" />
    <!-- Sheep Grazing -->
    <ellipse cx="50" cy="25" rx="12" ry="8" fill="#e2e8f0" />
    <circle cx="62" cy="22" r="4.5" fill="#2d3748" />
    <ellipse cx="30" cy="40" rx="10" ry="7" fill="#e2e8f0" />
    <circle cx="20" cy="38" r="4" fill="#2d3748" />
  </g>

  <!-- Shoreline with Fisherman -->
  <path d="M 460 500 Q 520 440 600 480 Q 640 500 680 500 Z" fill="#718096" />
  <g transform="translate(560, 440)">
    <!-- Fisherman Sitting near the water -->
    <ellipse cx="10" cy="15" rx="6" ry="12" fill="#2b6cb0" />
    <circle cx="10" cy="2" r="4" fill="#fbd38d" />
    <!-- Fishing Rod -->
    <line x1="12" y1="12" x2="35" y2="-5" stroke="#744210" stroke-width="2" />
    <line x1="35" y1="-5" x2="45" y2="35" stroke="#ffffff" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Renaissance Merchant Galleon (Sailing Past) -->
  <g transform="translate(620, 220)">
    <!-- Wooden Hull -->
    <path d="M 0 40 L 70 40 Q 60 55 40 55 L 15 55 Q 0 55 -5 40 Z" fill="#744210" />
    <!-- Three Masts and Billowing Sails -->
    <line x1="15" y1="40" x2="15" y2="5" stroke="#4a5568" stroke-width="2" />
    <line x1="38" y1="40" x2="38" y2="-5" stroke="#4a5568" stroke-width="2.5" />
    <line x1="58" y1="40" x2="58" y2="10" stroke="#4a5568" stroke-width="2" />
    <!-- Canvas Sails -->
    <rect x="7" y="10" width="16" height="20" rx="2" fill="#feebc8" opacity="0.9" />
    <rect x="28" y="2" width="20" height="25" rx="2" fill="#feebc8" opacity="0.95" />
    <rect x="50" y="14" width="15" height="18" rx="2" fill="#feebc8" opacity="0.9" />
  </g>

  <!-- The Splash & Icarus's Legs (Bottom Right, Unnoticed) -->
  <g transform="translate(680, 410)">
    <!-- Tiny Water Splash -->
    <path d="M 0 20 Q 8 8 12 18 Q 18 6 22 20 Q 28 10 32 20" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <!-- Pair of Legs Disappearing into the Waves -->
    <line x1="12" y1="15" x2="8" y2="3" stroke="#fbd38d" stroke-width="3" />
    <line x1="18" y1="16" x2="22" y2="4" stroke="#fbd38d" stroke-width="3" />
    <!-- Stray Feathers Floating on the Water -->
    <ellipse cx="35" cy="18" rx="5" ry="1.5" fill="#ffffff" transform="rotate(-15 35 18)" opacity="0.8" />
    <ellipse cx="-8" cy="22" rx="4" ry="1.2" fill="#ffffff" transform="rotate(20 -8 22)" opacity="0.7" />
  </g>

  <!-- Painting Caption Badge -->
  <rect x="25" y="440" width="410" height="38" rx="8" fill="#1a202c" opacity="0.85" />
  <text x="40" y="465" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f7fafc">Landscape with the Fall of Icarus — Pieter Brueghel</text>
</svg>
