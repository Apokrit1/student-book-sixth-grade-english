<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="morning_sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="balloon_stripes1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="valley_green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Morning Sky -->
  <rect width="800" height="380" fill="url(#morning_sky)"/>
  
  <!-- Sunrise Sun -->
  <circle cx="140" cy="240" r="50" fill="#fbbf24" opacity="0.8"/>

  <!-- Distant Mountain Peaks & Valleys -->
  <polygon points="0,380 120,290 260,350 420,280 580,340 720,295 800,340 800,380 0,380" fill="#475569" opacity="0.5"/>
  <polygon points="0,380 160,320 340,360 520,310 680,350 800,330 800,380 0,380" fill="#334155" opacity="0.7"/>

  <!-- Green Valley & Wildlife Sanctuary Ground -->
  <rect y="380" width="800" height="120" fill="url(#valley_green)"/>
  <!-- River Winding Through Valley -->
  <path d="M 0 460 Q 200 420 400 450 T 800 430" fill="none" stroke="#38bdf8" stroke-width="26" opacity="0.85"/>
  
  <!-- Flocks of Birds near Sanctuary -->
  <path d="M 180 200 Q 185 195 190 200 Q 195 195 200 200" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M 210 215 Q 215 210 220 215 Q 225 210 230 215" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Distant Hot-Air Balloons in Background -->
  <g transform="translate(180, 110) scale(0.35)">
    <ellipse cx="60" cy="70" rx="45" ry="55" fill="#f97316"/>
    <polygon points="25,110 95,110 75,140 45,140" fill="#f97316"/>
    <rect x="50" y="150" width="20" height="16" fill="#78350f"/>
    <line x1="45" y1="140" x2="52" y2="150" stroke="#0f172a" stroke-width="2"/>
    <line x1="75" y1="140" x2="68" y2="150" stroke="#0f172a" stroke-width="2"/>
  </g>
  <g transform="translate(620, 140) scale(0.4)">
    <ellipse cx="60" cy="70" rx="45" ry="55" fill="#a855f7"/>
    <polygon points="25,110 95,110 75,140 45,140" fill="#a855f7"/>
    <rect x="50" y="150" width="20" height="16" fill="#78350f"/>
  </g>

  <!-- Main Hero Hot-Air Balloon (Foreground Center) -->
  <g transform="translate(360, 40)">
    <!-- Balloon Envelope -->
    <ellipse cx="90" cy="110" rx="80" ry="95" fill="url(#balloon_stripes1)"/>
    <polygon points="35,180 145,180 115,225 65,225" fill="#ef4444"/>
    <!-- Balloon Contour Curves -->
    <path d="M 90 15 Q 50 110 65 225" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <path d="M 90 15 Q 130 110 115 225" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    
    <!-- Burner Flame -->
    <polygon points="80,230 100,230 90,215" fill="#f97316"/>
    <polygon points="85,230 95,230 90,220" fill="#fef08a"/>

    <!-- Rigging Ropes -->
    <line x1="65" y1="225" x2="72" y2="250" stroke="#451a03" stroke-width="3"/>
    <line x1="115" y1="225" x2="108" y2="250" stroke="#451a03" stroke-width="3"/>
    <line x1="80" y1="225" x2="82" y2="250" stroke="#451a03" stroke-width="2"/>
    <line x1="100" y1="225" x2="98" y2="250" stroke="#451a03" stroke-width="2"/>

    <!-- Wicker Passenger Basket -->
    <rect x="70" y="250" width="40" height="32" rx="4" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <line x1="70" y1="260" x2="110" y2="260" stroke="#451a03" stroke-width="1.5"/>
    <line x1="70" y1="270" x2="110" y2="270" stroke="#451a03" stroke-width="1.5"/>
    
    <!-- Passengers Waving -->
    <circle cx="82" cy="245" r="5" fill="#fed7aa"/>
    <circle cx="98" cy="245" r="5" fill="#fed7aa"/>
    <line x1="103" y1="244" x2="110" y2="238" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="445" width="300" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="400" y="470" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">HOT-AIR BALLOON CHALLENGE</text>
</svg>