<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="arena_cheer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="podium_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="podium_silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="podium_bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <!-- Arena Background with Flashlights -->
  <rect width="800" height="500" fill="url(#arena_cheer)"/>
  
  <!-- Flashbulbs / Cheering lights -->
  <circle cx="100" cy="80" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="160" cy="120" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="240" cy="60" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="600" cy="90" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="680" cy="70" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="740" cy="130" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Stadium Banners -->
  <rect x="180" y="20" width="440" height="60" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">PARALYMPIC CHAMPIONS SYDNEY 2000</text>
  <text x="400" y="65" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="system-ui, sans-serif">KONSTANTINOS FYKAS — 50m & 100m FREESTYLE WORLD RECORD</text>

  <!-- Greek Flag on Wall -->
  <g transform="translate(60, 40) scale(0.65)">
    <rect width="135" height="90" fill="#005bae"/>
    <!-- Stripes -->
    <rect y="10" width="135" height="10" fill="#ffffff"/>
    <rect y="30" width="135" height="10" fill="#ffffff"/>
    <rect y="50" width="135" height="10" fill="#ffffff"/>
    <rect y="70" width="135" height="10" fill="#ffffff"/>
    <!-- Cross Canton -->
    <rect width="50" height="50" fill="#005bae"/>
    <rect x="20" width="10" height="50" fill="#ffffff"/>
    <rect y="20" width="50" height="10" fill="#ffffff"/>
    <rect width="135" height="90" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Medal Podium -->
  <!-- 2nd Place (Silver) -->
  <rect x="160" y="270" width="140" height="180" rx="8" fill="url(#podium_silver)"/>
  <text x="230" y="340" text-anchor="middle" fill="#1e293b" font-size="48" font-weight="800" font-family="system-ui, sans-serif">2</text>
  
  <!-- 1st Place (Gold) -->
  <rect x="330" y="210" width="140" height="240" rx="8" fill="url(#podium_gold)"/>
  <text x="400" y="280" text-anchor="middle" fill="#78350f" font-size="56" font-weight="800" font-family="system-ui, sans-serif">1</text>

  <!-- 3rd Place (Bronze) -->
  <rect x="500" y="310" width="140" height="140" rx="8" fill="url(#podium_bronze)"/>
  <text x="570" y="380" text-anchor="middle" fill="#451a03" font-size="44" font-weight="800" font-family="system-ui, sans-serif">3</text>

  <!-- Champion Silhouette on 1st Place -->
  <!-- Head & Smile -->
  <circle cx="400" cy="140" r="18" fill="#fed7aa"/>
  <path d="M 388 132 Q 400 125 412 132" fill="#451a03"/>
  <!-- Athlete Jacket -->
  <polygon points="370,165 430,165 425,210 375,210" fill="#0284c7"/>
  <line x1="400" y1="165" x2="400" y2="210" stroke="#f8fafc" stroke-width="3"/>
  <!-- Raised Arms in Victory -->
  <path d="M 370 170 L 335 120 L 340 105" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
  <path d="M 430 170 L 465 120 L 460 105" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>

  <!-- Gold Medal around Champion's neck -->
  <path d="M 390 158 Q 400 185 410 158" fill="none" stroke="#005bae" stroke-width="4"/>
  <circle cx="400" cy="188" r="12" fill="url(#podium_gold)" stroke="#78350f" stroke-width="2"/>
  <text x="400" y="192" text-anchor="middle" fill="#78350f" font-size="10" font-weight="800">★</text>

  <!-- Laurel Wreath Crown -->
  <path d="M 382 132 Q 400 120 418 132" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>

  <!-- Title Badge -->
  <rect x="250" y="445" width="300" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="400" y="470" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">PARALYMPIC PODIUM OF GLORY</text>
</svg>