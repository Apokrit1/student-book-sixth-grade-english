<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stage_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="curtain_red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="30%" stop-color="#991b1b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Stage Background Wall -->
  <rect width="800" height="360" fill="url(#stage_glow)"/>

  <!-- Grand Proscenium Arch & Drapes -->
  <!-- Top Valance -->
  <path d="M 0 0 L 800 0 L 800 80 Q 700 120 600 80 Q 500 120 400 80 Q 300 120 200 80 Q 100 120 0 80 Z" fill="url(#curtain_red)"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#facc15" stroke-width="4"/>

  <!-- Left Velvet Curtain -->
  <path d="M 0 0 L 140 0 L 110 360 Q 60 380 0 360 Z" fill="url(#curtain_red)"/>
  <path d="M 30 0 Q 70 180 40 360" stroke="#450a0a" stroke-width="4" fill="none"/>
  <path d="M 80 0 Q 120 180 80 360" stroke="#450a0a" stroke-width="4" fill="none"/>

  <!-- Right Velvet Curtain -->
  <path d="M 800 0 L 660 0 L 690 360 Q 740 380 800 360 Z" fill="url(#curtain_red)"/>
  <path d="M 770 0 Q 730 180 760 360" stroke="#450a0a" stroke-width="4" fill="none"/>
  <path d="M 720 0 Q 680 180 720 360" stroke="#450a0a" stroke-width="4" fill="none"/>

  <!-- Golden Curtain Tassels -->
  <circle cx="105" cy="220" r="10" fill="#facc15"/>
  <line x1="105" y1="220" x2="105" y2="250" stroke="#facc15" stroke-width="4"/>
  <circle cx="695" cy="220" r="10" fill="#facc15"/>
  <line x1="695" y1="220" x2="695" y2="250" stroke="#facc15" stroke-width="4"/>

  <!-- Stage Wooden Floor -->
  <polygon points="100,360 700,360 800,430 0,430" fill="#78350f"/>
  <line x1="0" y1="395" x2="800" y2="395" stroke="#92400e" stroke-width="2"/>

  <!-- Center Spotlight Beam -->
  <polygon points="400,0 260,380 540,380" fill="#fef08a" opacity="0.3"/>
  <ellipse cx="400" cy="370" rx="140" ry="20" fill="url(#spotlight)"/>

  <!-- Actors Performing Musical Number -->
  <!-- Lead Singer / Actress -->
  <circle cx="360" cy="260" r="14" fill="#fed7aa"/>
  <polygon points="345,275 375,275 385,340 335,340" fill="#ec4899"/>
  <!-- Microphone Stand -->
  <line x1="375" y1="265" x2="375" y2="340" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="375" cy="262" r="5" fill="#475569"/>

  <!-- Lead Dancer / Actor -->
  <circle cx="440" cy="255" r="14" fill="#fed7aa"/>
  <polygon points="425,270 455,270 450,310 430,310" fill="#1e293b"/>
  <line x1="430" y1="310" x2="425" y2="345" stroke="#1e293b" stroke-width="6"/>
  <line x1="450" y1="310" x2="465" y2="345" stroke="#1e293b" stroke-width="6"/>
  <!-- Top Hat -->
  <rect x="430" y="235" width="20" height="15" fill="#0f172a"/>
  <line x1="424" y1="250" x2="456" y2="250" stroke="#0f172a" stroke-width="4"/>

  <!-- Packed Audience Silhouette (Foreground Bottom) -->
  <rect y="430" width="800" height="70" fill="#0f172a"/>
  <!-- Heads of Audience -->
  <circle cx="60" cy="445" r="16" fill="#1e293b"/>
  <circle cx="120" cy="440" r="18" fill="#1e293b"/>
  <circle cx="180" cy="448" r="15" fill="#1e293b"/>
  <circle cx="240" cy="442" r="17" fill="#1e293b"/>
  <circle cx="300" cy="445" r="16" fill="#1e293b"/>
  <circle cx="360" cy="438" r="18" fill="#1e293b"/>
  <circle cx="420" cy="446" r="16" fill="#1e293b"/>
  <circle cx="480" cy="440" r="18" fill="#1e293b"/>
  <circle cx="540" cy="444" r="17" fill="#1e293b"/>
  <circle cx="600" cy="442" r="16" fill="#1e293b"/>
  <circle cx="660" cy="446" r="17" fill="#1e293b"/>
  <circle cx="720" cy="440" r="18" fill="#1e293b"/>

  <!-- Title Badge -->
  <rect x="250" y="20" width="300" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">WEST END MUSICAL STAGE</text>
</svg>