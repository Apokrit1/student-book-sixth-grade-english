<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect width="200" height="200" rx="24" fill="#eff6ff"/>
  <rect x="8" y="8" width="184" height="184" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>

  <!-- Blackboard / Notebook element -->
  <rect x="30" y="30" width="140" height="100" rx="8" fill="#1e293b"/>
  <text x="45" y="65" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8">2 + 2 = 4</text>
  <text x="45" y="95" font-family="'JetBrains Mono', monospace" font-size="16" fill="#facc15">π ≈ 3.14</text>
  <text x="45" y="118" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a7f3d0">x² + y² = z²</text>

  <!-- Ruler & Compass tool -->
  <g transform="translate(30, 140)">
    <rect x="0" y="5" width="140" height="22" rx="4" fill="url(#mathGrad)"/>
    <line x1="15" y1="5" x2="15" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="30" y1="5" x2="30" y2="18" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="45" y1="5" x2="45" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="5" x2="60" y2="18" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="75" y1="5" x2="75" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="90" y1="5" x2="90" y2="18" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="105" y1="5" x2="105" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="120" y1="5" x2="120" y2="18" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
