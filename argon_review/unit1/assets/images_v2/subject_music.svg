<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="musicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect width="200" height="200" rx="24" fill="#fffbeb"/>
  <rect x="8" y="8" width="184" height="184" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>

  <!-- Music Stave -->
  <g transform="translate(25, 45)">
    <line x1="0" y1="15" x2="150" y2="15" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="30" x2="150" y2="30" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="45" x2="150" y2="45" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="60" x2="150" y2="60" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="75" x2="150" y2="75" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Treble Clef -->
  <g transform="translate(42, 48)">
    <path d="M 22,75 Q 18,70 18,65 Q 18,52 28,45 Q 36,38 32,25 Q 28,10 24,0 Q 20,15 22,35 Q 24,48 15,55 Q 5,62 5,72 Q 5,88 20,88 Q 38,88 38,70 Q 38,55 24,55 Q 18,55 18,62 Q 18,68 24,68 Q 28,68 28,64 L 24,8 Q 24,0 26,0 Q 28,0 28,10 L 26,95 Q 26,108 20,108 Q 12,108 12,102 Q 12,96 18,96 Q 22,96 22,100" fill="#d97706"/>
  </g>

  <!-- Musical Notes -->
  <g transform="translate(100, 60)">
    <!-- Beam note pair -->
    <ellipse cx="20" cy="50" rx="9" ry="6" fill="#1e293b" transform="rotate(-20, 20, 50)"/>
    <line x1="26" y1="48" x2="26" y2="15" stroke="#1e293b" stroke-width="3.5"/>
    <ellipse cx="55" cy="40" rx="9" ry="6" fill="#1e293b" transform="rotate(-20, 55, 40)"/>
    <line x1="61" y1="38" x2="61" y2="5" stroke="#1e293b" stroke-width="3.5"/>
    <polygon points="26,15 61,5 61,12 26,22" fill="#1e293b"/>
  </g>

  <!-- Single Eighth Note -->
  <g transform="translate(145, 105)">
    <ellipse cx="15" cy="40" rx="8" ry="5" fill="#f59e0b" transform="rotate(-20, 15, 40)"/>
    <line x1="20" y1="38" x2="20" y2="10" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 20,10 Q 32,15 30,28 Q 28,20 20,18 Z" fill="#f59e0b"/>
  </g>
</svg>
