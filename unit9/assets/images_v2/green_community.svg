<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <linearGradient id="bayWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="parkGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="solarPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Clean Blue Sky -->
  <rect width="800" height="500" fill="url(#cleanSky)"/>

  <!-- Bright Sun with Solar Rays -->
  <circle cx="100" cy="90" r="40" fill="#fde047"/>
  <circle cx="100" cy="90" r="50" fill="#fef08a" opacity="0.4"/>

  <!-- Wind Turbines (Distant Hills) -->
  <g transform="translate(180, 110) scale(0.65)">
    <line x1="0" y1="120" x2="0" y2="0" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#e2e8f0"/>
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#f8fafc" stroke-width="3"/>
    <line x1="0" y1="0" x2="48" y2="28" stroke="#f8fafc" stroke-width="3"/>
    <line x1="0" y1="0" x2="-48" y2="28" stroke="#f8fafc" stroke-width="3"/>
  </g>
  <g transform="translate(250, 125) scale(0.5)">
    <line x1="0" y1="120" x2="0" y2="0" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="#e2e8f0"/>
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#f8fafc" stroke-width="3"/>
    <line x1="0" y1="0" x2="48" y2="28" stroke="#f8fafc" stroke-width="3"/>
    <line x1="0" y1="0" x2="-48" y2="28" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- Modern Green Buildings with Rooftop Solar Panels (Center Background) -->
  <g transform="translate(340, 100)">
    <!-- Building 1 -->
    <rect x="0" y="50" width="90" height="150" fill="#f1f5f9"/>
    <!-- Windows -->
    <rect x="15" y="70" width="20" height="25" fill="#38bdf8"/>
    <rect x="55" y="70" width="20" height="25" fill="#38bdf8"/>
    <rect x="15" y="110" width="20" height="25" fill="#38bdf8"/>
    <rect x="55" y="110" width="20" height="25" fill="#38bdf8"/>
    <!-- Rooftop Solar Grid -->
    <polygon points="-5,50 95,50 85,35 5,35" fill="url(#solarPanel)"/>
    <line x1="30" y1="35" x2="25" y2="50" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="60" y1="35" x2="65" y2="50" stroke="#93c5fd" stroke-width="1.5"/>

    <!-- Building 2 (Eco Center) -->
    <rect x="110" y="70" width="110" height="130" fill="#e2e8f0"/>
    <polygon points="105,70 225,70 215,50 115,50" fill="url(#solarPanel)"/>
    <rect x="125" y="90" width="30" height="30" fill="#86efac"/>
    <rect x="175" y="90" width="30" height="30" fill="#86efac"/>
    <rect x="145" y="150" width="40" height="50" rx="3" fill="#0f172a"/>
  </g>

  <!-- Clear Ocean Bay Waters (Right) -->
  <path d="M 520 230 C 580 230 650 250 800 240 L 800 500 L 480 500 Z" fill="url(#bayWater)"/>
  <!-- Sailboat on Water -->
  <g transform="translate(680, 260) scale(0.7)">
    <polygon points="20,10 60,60 20,60" fill="#f8fafc"/>
    <polygon points="15,20 -15,60 15,60" fill="#38bdf8"/>
    <polygon points="-25,65 70,65 55,80 -10,80" fill="#0284c7"/>
  </g>

  <!-- Community Park & Clean Road (Foreground Left & Center) -->
  <path d="M 0 240 Q 260 230 520 250 L 520 500 L 0 500 Z" fill="url(#parkGrass)"/>
  <!-- Asphalt Roadway -->
  <polygon points="0,410 490,410 520,500 0,500" fill="#334155"/>
  <line x1="0" y1="455" x2="505" y2="455" stroke="#fde047" stroke-width="4" stroke-dasharray="25 15"/>

  <!-- Electric Recycling Truck (On Road) -->
  <g transform="translate(140, 345)">
    <!-- Cabin -->
    <path d="M 170 30 L 210 30 C 225 30 235 45 235 60 L 235 90 L 170 90 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="180" y="40" width="35" height="25" rx="3" fill="#38bdf8"/>
    <!-- Cargo Box (Green) -->
    <rect x="10" y="10" width="160" height="80" rx="6" fill="url(#truckBody)"/>
    <!-- Recycling Symbol & Plug on Truck -->
    <circle cx="85" cy="50" r="24" fill="#ffffff" opacity="0.9"/>
    <text x="85" y="58" font-family="sans-serif" font-size="22" font-weight="bold" fill="#15803d" text-anchor="middle">♻</text>
    <text x="135" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">⚡</text>
    <!-- Wheels -->
    <circle cx="50" cy="92" r="18" fill="#0f172a"/>
    <circle cx="50" cy="92" r="8" fill="#94a3b8"/>
    <circle cx="140" cy="92" r="18" fill="#0f172a"/>
    <circle cx="140" cy="92" r="8" fill="#94a3b8"/>
    <circle cx="205" cy="92" r="18" fill="#0f172a"/>
    <circle cx="205" cy="92" r="8" fill="#94a3b8"/>
  </g>

  <!-- Title Badge (Top Center) -->
  <g transform="translate(250, 30)">
    <rect width="320" height="40" rx="10" fill="#0f172a" opacity="0.8"/>
    <text x="160" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4ade80" text-anchor="middle">Eco-Friendly Future • Zero Waste</text>
  </g>
</svg>
