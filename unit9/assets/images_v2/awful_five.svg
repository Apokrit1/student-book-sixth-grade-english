<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="theaterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="curtainRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="stageWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="villainPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>

  <!-- Theater Background -->
  <rect width="800" height="500" fill="url(#theaterBg)"/>

  <!-- Velvet Curtains -->
  <!-- Top Valence -->
  <path d="M 0 0 L 800 0 L 800 70 Q 700 95 600 65 Q 500 95 400 65 Q 300 95 200 65 Q 100 95 0 70 Z" fill="url(#curtainRed)"/>
  <!-- Left Drape -->
  <path d="M 0 0 L 110 0 C 80 180 140 320 90 440 L 0 440 Z" fill="url(#curtainRed)"/>
  <!-- Right Drape -->
  <path d="M 800 0 L 690 0 C 720 180 660 320 710 440 L 800 440 Z" fill="url(#curtainRed)"/>

  <!-- Wooden Stage Floor -->
  <polygon points="60,400 740,400 800,500 0,500" fill="url(#stageWood)"/>
  <line x1="160" y1="400" x2="130" y2="500" stroke="#451a03" stroke-width="2"/>
  <line x1="320" y1="400" x2="310" y2="500" stroke="#451a03" stroke-width="2"/>
  <line x1="480" y1="400" x2="490" y2="500" stroke="#451a03" stroke-width="2"/>
  <line x1="640" y1="400" x2="670" y2="500" stroke="#451a03" stroke-width="2"/>

  <!-- Spotlight Circle -->
  <ellipse cx="400" cy="415" rx="260" ry="50" fill="#fef08a" opacity="0.25"/>

  <!-- Stage Prop: Factory Chimney (Left) -->
  <g transform="translate(150, 160)">
    <rect x="25" y="60" width="60" height="180" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <polygon points="15,60 95,60 85,45 25,45" fill="#92400e"/>
    <!-- Brick pattern lines -->
    <line x1="25" y1="100" x2="85" y2="100" stroke="#451a03" stroke-width="2"/>
    <line x1="25" y1="140" x2="85" y2="140" stroke="#451a03" stroke-width="2"/>
    <line x1="25" y1="180" x2="85" y2="180" stroke="#451a03" stroke-width="2"/>
    <!-- Billowing Smoke Puff -->
    <path d="M 45 45 C 30 15 60 -15 80 5 C 100 -20 140 10 110 35 C 130 50 100 80 75 55 Z" fill="url(#smokeGrad)"/>
    <path d="M 65 15 C 75 -25 120 -35 130 -10 C 150 -10 160 20 135 30 Z" fill="url(#smokeGrad)" opacity="0.6"/>
  </g>

  <!-- Stage Prop: Acid Rain Cloud (Right) -->
  <g transform="translate(520, 110)">
    <path d="M 40 70 Q 20 40 60 30 Q 80 10 120 20 Q 150 5 180 30 Q 220 35 210 70 Q 230 100 190 110 Q 150 125 100 115 Q 50 125 40 70 Z" fill="#64748b"/>
    <!-- Raindrops / Acid Rain -->
    <line x1="80" y1="130" x2="70" y2="165" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="120" y1="135" x2="110" y2="170" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="160" y1="130" x2="150" y2="165" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6"/>
  </g>

  <!-- Drama Character: Harry Wheezer (Center Stage) -->
  <g transform="translate(350, 200)">
    <!-- Villain Cape -->
    <path d="M 40 80 L -10 200 L 90 200 Z" fill="url(#villainPurple)"/>
    <!-- Body / Suit -->
    <rect x="25" y="80" width="35" height="75" rx="5" fill="#334155"/>
    <polygon points="35,80 42,120 50,80" fill="#f8fafc"/>
    <polygon points="40,85 45,85 42,110" fill="#dc2626"/>
    <!-- Head -->
    <circle cx="42" cy="50" r="22" fill="#fed7aa"/>
    <!-- Sleek theatrical hair -->
    <path d="M 22 45 Q 42 20 62 45 Q 52 30 32 30 Z" fill="#1e293b"/>
    <!-- Mask / Glasses -->
    <rect x="28" y="42" width="28" height="10" rx="3" fill="#0f172a"/>
    <!-- Legs -->
    <rect x="28" y="155" width="12" height="50" fill="#1e293b"/>
    <rect x="44" y="155" width="12" height="50" fill="#1e293b"/>
    <!-- Picket Sign held in hand -->
    <line x1="60" y1="120" x2="85" y2="30" stroke="#d97706" stroke-width="4"/>
    <rect x="50" y="10" width="70" height="35" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="85" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">DIRTY AIR!</text>
  </g>

  <!-- Title Badge (Top Center) -->
  <g transform="translate(250, 30)">
    <rect width="300" height="40" rx="10" fill="#0f172a" opacity="0.8"/>
    <text x="150" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fde047" text-anchor="middle">The Awful Five • School Drama Club</text>
  </g>
</svg>
