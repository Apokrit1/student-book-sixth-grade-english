<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="680" cy="120" r="55" fill="#fef08a" opacity="0.8"/>
  <circle cx="680" cy="120" r="45" fill="#fde047"/>

  <!-- Clouds -->
  <path d="M 80 110 Q 110 80 150 90 Q 190 70 230 95 Q 260 90 280 110 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 420 130 Q 450 100 480 110 Q 520 90 550 120 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Ocean Waves -->
  <path d="M 0 210 Q 200 190 400 210 T 800 205 L 800 320 L 0 320 Z" fill="url(#seaGrad)"/>
  <path d="M 0 240 Q 200 225 400 240 T 800 235 L 800 320 L 0 320 Z" fill="#0284c7" opacity="0.6"/>
  <!-- White surf foam -->
  <path d="M 0 280 Q 150 265 300 285 T 600 275 T 800 290" fill="none" stroke="#e0f2fe" stroke-width="6" opacity="0.8"/>

  <!-- Sandy Shore Dunes -->
  <path d="M 0 285 Q 260 270 500 300 T 800 310 L 800 500 L 0 500 Z" fill="url(#sandGrad)"/>

  <!-- Coastal Sea Rocks (Left) -->
  <path d="M 30 450 C 40 370 120 360 170 410 C 200 435 220 480 200 500 L 20 500 Z" fill="#475569"/>
  <path d="M 60 460 C 70 400 130 390 160 430 C 180 450 190 480 170 500 L 40 500 Z" fill="#64748b"/>

  <!-- Orange Starfish on Rock -->
  <g transform="translate(110, 425) scale(0.65)">
    <polygon points="25,0 32,15 49,18 37,30 40,47 25,39 9,47 13,30 0,18 17,15" fill="url(#starGrad)"/>
    <circle cx="25" cy="24" r="4" fill="#c2410c"/>
  </g>

  <!-- Green Rubbish Recycling Sacks (Center-Right) -->
  <g transform="translate(480, 340)">
    <!-- Sack 1 -->
    <path d="M 20 50 C 10 30 30 10 45 10 C 60 10 80 30 70 50 C 75 75 70 110 50 115 C 25 110 15 75 20 50 Z" fill="url(#bagGrad)"/>
    <path d="M 38 12 Q 45 6 52 12" stroke="#15803d" stroke-width="4" fill="none"/>
    <text x="45" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">♻</text>
    <!-- Sack 2 -->
    <path d="M 75 60 C 65 40 85 20 100 20 C 115 20 135 40 125 60 C 130 85 125 115 105 120 C 80 115 70 85 75 60 Z" fill="#22c55e"/>
    <path d="M 93 22 Q 100 16 107 22" stroke="#15803d" stroke-width="4" fill="none"/>
    <text x="100" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">♻</text>
  </g>

  <!-- Cleanup Tools: Litter Picker & Sifter (Right) -->
  <g transform="translate(630, 360)">
    <line x1="0" y1="90" x2="35" y2="10" stroke="#94a3b8" stroke-width="4"/>
    <rect x="30" y="5" width="12" height="18" rx="2" fill="#0284c7"/>
    <line x1="45" y1="95" x2="65" y2="25" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="60,20 75,20 70,35 55,35" fill="#f97316"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 40)">
    <rect width="270" height="42" rx="10" fill="#0f172a" opacity="0.75"/>
    <text x="135" y="27" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Sunset Shore Beach Cleanup</text>
  </g>
</svg>
