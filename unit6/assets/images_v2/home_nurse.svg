<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="room_wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="floor_wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Cozy Living Room Wall -->
  <rect width="800" height="360" fill="url(#room_wall)"/>
  
  <!-- Window with Curtains and Garden View -->
  <rect x="520" y="50" width="220" height="200" rx="8" fill="#e0f2fe"/>
  <circle cx="680" cy="100" r="40" fill="#fef08a"/>
  <!-- Trees in window -->
  <circle cx="560" cy="210" r="30" fill="#22c55e"/>
  <circle cx="620" cy="200" r="45" fill="#16a34a"/>
  <circle cx="700" cy="215" r="35" fill="#15803d"/>
  <!-- Window frame -->
  <rect x="520" y="50" width="220" height="200" rx="8" fill="none" stroke="#cbd5e1" stroke-width="8"/>
  <line x1="630" y1="50" x2="630" y2="250" stroke="#cbd5e1" stroke-width="6"/>
  <line x1="520" y1="150" x2="740" y2="150" stroke="#cbd5e1" stroke-width="6"/>

  <!-- Floor -->
  <rect y="360" width="800" height="140" fill="url(#floor_wood)"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#78350f" stroke-width="2"/>
  <line x1="0" y1="455" x2="800" y2="455" stroke="#78350f" stroke-width="2"/>

  <!-- Comfortable Armchair -->
  <rect x="100" y="240" width="160" height="160" rx="20" fill="#0284c7"/>
  <rect x="120" y="160" width="120" height="130" rx="20" fill="#0369a1"/>
  <rect x="80" y="270" width="40" height="90" rx="15" fill="#075985"/>
  <rect x="240" y="270" width="40" height="90" rx="15" fill="#075985"/>
  <ellipse cx="180" cy="260" rx="45" ry="25" fill="#38bdf8"/>

  <!-- Small Tea Table -->
  <rect x="300" y="320" width="110" height="15" rx="4" fill="#78350f"/>
  <rect x="350" y="335" width="12" height="110" fill="#581c87"/>
  <ellipse cx="355" cy="445" rx="35" ry="10" fill="#581c87"/>
  <!-- Teacup and steaming tea -->
  <ellipse cx="335" cy="315" rx="14" ry="7" fill="#f8fafc"/>
  <path d="M 330 305 Q 332 295 330 285" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 338 305 Q 340 295 338 285" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Medical First Aid Kit / Nurse Bag -->
  <rect x="440" y="320" width="150" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  <path d="M 490 320 L 490 300 Q 490 290 515 290 Q 540 290 540 300 L 540 320" fill="none" stroke="#0284c7" stroke-width="6"/>
  <!-- Red Cross Emblem -->
  <rect x="505" y="355" width="20" height="40" rx="3" fill="#ef4444"/>
  <rect x="495" y="365" width="40" height="20" rx="3" fill="#ef4444"/>
  <rect x="440" y="370" width="150" height="6" fill="#0284c7"/>

  <!-- Blood Pressure Monitor & Stethoscope -->
  <ellipse cx="640" cy="390" rx="45" ry="20" fill="#334155"/>
  <path d="M 620 380 Q 590 350 630 320 Q 660 300 680 340" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="680" cy="340" r="16" fill="#94a3b8" stroke="#64748b" stroke-width="4"/>

  <!-- Title Badge -->
  <rect x="250" y="25" width="300" height="38" rx="8" fill="#0f172a" opacity="0.85"/>
  <text x="400" y="50" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">HOME HEALTH NURSE VISIT</text>
</svg>