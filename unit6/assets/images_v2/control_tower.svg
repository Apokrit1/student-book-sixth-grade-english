<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky_sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="70%" stop-color="#c026d3"/>
      <stop offset="90%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="radar_sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Sunset Sky -->
  <rect width="800" height="350" fill="url(#sky_sunset)"/>

  <!-- Distant Mountains & Horizon -->
  <polygon points="0,340 160,300 320,335 480,310 650,340 800,325 800,350 0,350" fill="#475569" opacity="0.6"/>

  <!-- Airport Runway & Ground -->
  <rect y="350" width="800" height="150" fill="#1e293b"/>
  <!-- Runway Tarmac -->
  <polygon points="200,500 320,350 360,350 480,500" fill="#0f172a"/>
  <!-- Centerline Dash -->
  <line x1="340" y1="350" x2="340" y2="500" stroke="#facc15" stroke-width="6" stroke-dasharray="25,15"/>
  <!-- Runway Edge Lights -->
  <circle cx="315" cy="360" r="4" fill="#38bdf8"/>
  <circle cx="365" cy="360" r="4" fill="#38bdf8"/>
  <circle cx="280" cy="420" r="6" fill="#38bdf8"/>
  <circle cx="400" cy="420" r="6" fill="#38bdf8"/>
  <circle cx="225" cy="490" r="8" fill="#38bdf8"/>
  <circle cx="455" cy="490" r="8" fill="#38bdf8"/>

  <!-- Airplane on Runway Taking Off -->
  <g transform="translate(480, 260) scale(0.65)">
    <polygon points="0,40 120,40 160,20 200,20 220,35 240,40 0,40" fill="#f8fafc"/>
    <polygon points="70,40 120,0 145,0 125,40" fill="#3b82f6"/>
    <polygon points="10,40 40,0 60,0 40,40" fill="#ef4444"/>
    <ellipse cx="90" cy="45" rx="14" ry="6" fill="#0284c7"/>
  </g>

  <!-- Airplane in Sky -->
  <g transform="translate(140, 100) scale(0.4) rotate(-15)">
    <polygon points="0,40 120,40 160,20 200,20 220,35 240,40 0,40" fill="#f8fafc"/>
    <polygon points="70,40 120,0 145,0 125,40" fill="#3b82f6"/>
    <polygon points="10,40 40,0 60,0 40,40" fill="#3b82f6"/>
  </g>

  <!-- Air Traffic Control Tower (Foreground Left) -->
  <rect x="620" y="160" width="70" height="340" fill="#cbd5e1"/>
  <polygon points="590,160 720,160 740,80 570,80" fill="#334155"/>
  <!-- Tower Windows -->
  <polygon points="595,150 715,150 730,90 580,90" fill="#0284c7" opacity="0.75"/>
  <line x1="620" y1="90" x2="625" y2="150" stroke="#0f172a" stroke-width="4"/>
  <line x1="655" y1="90" x2="655" y2="150" stroke="#0f172a" stroke-width="4"/>
  <line x1="690" y1="90" x2="685" y2="150" stroke="#0f172a" stroke-width="4"/>
  <!-- Tower Antenna & Dome -->
  <rect x="645" y="45" width="20" height="35" fill="#64748b"/>
  <circle cx="655" cy="45" r="16" fill="#e2e8f0"/>
  <line x1="655" y1="30" x2="655" y2="5" stroke="#ef4444" stroke-width="4"/>
  <circle cx="655" cy="5" r="5" fill="#ef4444"/>

  <!-- Radar Screen Inset (Bottom Left) -->
  <rect x="30" y="320" width="160" height="150" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="4"/>
  <circle cx="110" cy="395" r="55" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="110" cy="395" r="35" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="110" cy="395" r="15" fill="none" stroke="#16a34a" stroke-width="2"/>
  <line x1="110" y1="340" x2="110" y2="450" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="55" y1="395" x2="165" y2="395" stroke="#16a34a" stroke-width="1.5"/>
  <!-- Radar Blips -->
  <circle cx="130" cy="370" r="5" fill="#4ade80"/>
  <text x="138" y="372" fill="#4ade80" font-size="10" font-family="monospace">BA342</text>
  <circle cx="95" cy="420" r="5" fill="#4ade80"/>
  <text x="75" y="435" fill="#4ade80" font-size="10" font-family="monospace">OA118</text>

  <!-- Title Badge -->
  <rect x="250" y="20" width="300" height="38" rx="8" fill="#0f172a" opacity="0.85"/>
  <text x="400" y="45" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" font-family="system-ui, sans-serif">AIR TRAFFIC CONTROL TOWER</text>
</svg>