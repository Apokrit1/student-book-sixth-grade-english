<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Greek Sky & Temple Columns -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <rect x="0" y="400" width="800" height="100" fill="#d7ccc8"/>

  <!-- Ancient Temple Pillars Background -->
  <g fill="url(#marbleGrad)" stroke="#bcaaa4" stroke-width="2">
    <rect x="80" y="60" width="40" height="340"/>
    <rect x="220" y="60" width="40" height="340"/>
    <rect x="540" y="60" width="40" height="340"/>
    <rect x="680" y="60" width="40" height="340"/>
    <!-- Entablature Top -->
    <rect x="50" y="30" width="700" height="35" rx="4"/>
  </g>

  <!-- Greek Woman with Braids and Linen Tunic -->
  <g transform="translate(240, 100)">
    <!-- Braids Hair -->
    <path d="M 60 40 C 40 20, 20 60, 25 130 C 35 130, 45 70, 55 50 Z" fill="#4e342e"/>
    <path d="M 80 40 C 100 20, 120 60, 115 130 C 105 130, 95 70, 85 50 Z" fill="#4e342e"/>
    <!-- Head -->
    <circle cx="70" cy="50" r="26" fill="#ffccbc"/>
    <circle cx="64" cy="48" r="2.5" fill="#3e2723"/>
    <circle cx="78" cy="48" r="2.5" fill="#3e2723"/>
    <!-- Linen Peplos / Tunic (Light Summer Material) -->
    <path d="M 45 75 L 95 75 L 115 300 L 25 300 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    <path d="M 35 140 Q 70 160 105 140" fill="none" stroke="#d4af37" stroke-width="4"/>
    <path d="M 25 300 L 115 300 L 110 305 L 20 305 Z" fill="#d4af37"/>
    <!-- Golden brooch pins on shoulders -->
    <circle cx="48" cy="78" r="5" fill="#ffd700"/>
    <circle cx="92" cy="78" r="5" fill="#ffd700"/>
    <!-- Perfume Bottle (Aryballos) in Hand -->
    <ellipse cx="120" cy="180" rx="10" ry="14" fill="#d4af37" stroke="#8d6e63" stroke-width="2"/>
    <line x1="120" y1="166" x2="120" y2="160" stroke="#8d6e63" stroke-width="3"/>
  </g>

  <!-- Greek Man with Beard, Tunic and Toga -->
  <g transform="translate(440, 90)">
    <!-- Head & Beard -->
    <circle cx="70" cy="55" r="26" fill="#ffccbc"/>
    <path d="M 50 60 Q 70 105 90 60 Z" fill="#3e2723"/>
    <circle cx="64" cy="50" r="2.5" fill="#222"/>
    <circle cx="78" cy="50" r="2.5" fill="#222"/>
    <!-- Under Tunic -->
    <path d="M 45 80 L 95 80 L 105 260 L 35 260 Z" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
    <!-- Draped Woollen Toga (Himation) in Warm Maroon -->
    <path d="M 40 85 Q 90 120 115 220 L 70 310 L 30 200 Z" fill="#880e4f" opacity="0.95"/>
    <path d="M 40 85 Q 20 180 50 280 L 80 270" fill="none" stroke="#ad1457" stroke-width="12" stroke-linecap="round"/>
    <!-- Leather Sandals -->
    <rect x="45" y="305" width="20" height="8" rx="3" fill="#5d4037"/>
    <rect x="80" y="305" width="20" height="8" rx="3" fill="#5d4037"/>
  </g>

  <!-- Caption text -->
  <text x="400" y="460" text-anchor="middle" fill="#3e2723" font-family="Arial, sans-serif" font-size="22" font-weight="bold">CLOTHING &amp; GROOMING IN ANCIENT GREECE</text>
</svg>