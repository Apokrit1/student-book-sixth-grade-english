<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cobbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#5f0909"/>
    </linearGradient>
  </defs>

  <!-- Victorian London Street Background -->
  <rect width="800" height="380" fill="#eceff1"/>
  <!-- London Rowhouses Silhouettes -->
  <path d="M 0 380 L 0 200 L 80 200 L 80 160 L 150 160 L 150 220 L 280 220 L 280 180 L 380 180 L 380 230 L 520 230 L 520 150 L 620 150 L 620 210 L 800 210 L 800 380 Z" fill="#cfd8dc"/>
  <rect x="0" y="380" width="800" height="120" fill="url(#cobbleGrad)"/>

  <!-- Pair of Carriage Horses -->
  <g transform="translate(100, 240)">
    <!-- Horse 1 -->
    <path d="M 20 80 Q 50 30 110 50 L 130 90 L 110 140 L 95 140 L 95 90 L 60 90 L 50 140 L 35 140 L 35 90 Z" fill="#5d4037"/>
    <!-- Head & Mane -->
    <circle cx="20" cy="55" r="16" fill="#5d4037"/>
    <path d="M 10 65 L 5 45 L 20 50 Z" fill="#4e342e"/>
    <!-- Harness and Reins -->
    <line x1="20" y1="60" x2="220" y2="70" stroke="#ffb300" stroke-width="2.5"/>
  </g>
  <g transform="translate(140, 250)">
    <!-- Horse 2 -->
    <path d="M 20 80 Q 50 30 110 50 L 130 90 L 110 140 L 95 140 L 95 90 L 60 90 L 50 140 L 35 140 L 35 90 Z" fill="#795548"/>
    <circle cx="20" cy="55" r="16" fill="#795548"/>
  </g>

  <!-- Victorian Omnibus Carriage -->
  <g transform="translate(360, 160)">
    <!-- Coach Body -->
    <rect x="0" y="50" width="320" height="150" rx="15" fill="url(#busBody)" stroke="#ffd700" stroke-width="4"/>
    
    <!-- Roof Rails & Upper Deck Passenger Benches -->
    <rect x="20" y="15" width="280" height="35" rx="5" fill="#3e2723"/>
    <line x1="20" y1="15" x2="300" y2="15" stroke="#ffd700" stroke-width="3"/>
    <!-- Small Silhouette Passengers on Roof -->
    <circle cx="70" cy="8" r="8" fill="#212121"/>
    <circle cx="120" cy="8" r="8" fill="#212121"/>
    <circle cx="220" cy="8" r="8" fill="#212121"/>

    <!-- Windows with Pale Light -->
    <rect x="25" y="75" width="55" height="60" rx="4" fill="#fff9c4" stroke="#333" stroke-width="2"/>
    <rect x="95" y="75" width="55" height="60" rx="4" fill="#fff9c4" stroke="#333" stroke-width="2"/>
    <rect x="165" y="75" width="55" height="60" rx="4" fill="#fff9c4" stroke="#333" stroke-width="2"/>
    <rect x="235" y="75" width="55" height="60" rx="4" fill="#fff9c4" stroke="#333" stroke-width="2"/>

    <!-- Signage Banner -->
    <rect x="40" y="150" width="240" height="28" fill="#ffd700" rx="4"/>
    <text x="160" y="170" text-anchor="middle" fill="#000" font-family="Times New Roman, serif" font-size="16" font-weight="bold">LONDON OMNIBUS 1836</text>

    <!-- Wheels (Large Wooden Spoked Wheels) -->
    <g transform="translate(50, 200)">
      <circle cx="0" cy="0" r="45" fill="#212121" stroke="#ffd700" stroke-width="3"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#795548" stroke-width="6"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#ffd700" stroke-width="3"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#ffd700" stroke-width="3"/>
      <line x1="-25" y1="-25" x2="25" y2="25" stroke="#ffd700" stroke-width="3"/>
      <line x1="-25" y1="25" x2="25" y2="-25" stroke="#ffd700" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#ffd700"/>
    </g>
    <g transform="translate(260, 200)">
      <circle cx="0" cy="0" r="45" fill="#212121" stroke="#ffd700" stroke-width="3"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#795548" stroke-width="6"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#ffd700" stroke-width="3"/>
      <line x1="0" y1="-35" x2="0" y2="35" stroke="#ffd700" stroke-width="3"/>
      <line x1="-25" y1="-25" x2="25" y2="25" stroke="#ffd700" stroke-width="3"/>
      <line x1="-25" y1="25" x2="25" y2="-25" stroke="#ffd700" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#ffd700"/>
    </g>

    <!-- Rear Conductor Platform -->
    <rect x="-30" y="110" width="30" height="90" fill="#333" stroke="#ffd700" stroke-width="2"/>
    <!-- Conductor Silhouette -->
    <circle cx="-15" cy="100" r="10" fill="#1565c0"/>
    <rect x="-24" y="112" width="18" height="40" fill="#1565c0"/>
  </g>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#37474f" font-family="Arial, sans-serif" font-size="24" font-weight="bold">VICTORIAN HORSE-DRAWN OMNIBUS</text>
</svg>